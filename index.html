/* Konversi koordinat layar -> koordinat SVG */
function svgPoint(evt){
  const svg = $('#erd-svg'), m = svg && svg.getScreenCTM();
  if (!m) return { x:0, y:0 };
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(m.inverse());
}
function selectItem(type, id){ erdSel = type ? { type, id } : null; renderCanvas(); renderInspector(); }
function clampEnt(en){ const D = dims(en); en.x = clamp(en.x, 0, Math.max(0, CW - D.w)); en.y = clamp(en.y, 0, Math.max(0, CH - D.h)); }
function bindErdCanvas(){
  const svg = $('#erd-svg'); if (!svg) return;
  svg.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const g = e.target.closest('[data-ent]'), rg = e.target.closest('[data-rel]');
    if (g) {
      const en = getEnt(g.dataset.ent), p = svgPoint(e);
      drag = { id:en.id, dx:p.x - en.x, dy:p.y - en.y, sx:e.clientX, sy:e.clientY, moved:false };
      if (!(erdSel && erdSel.id === en.id)) selectItem('ent', en.id); else renderCanvas();
      e.preventDefault();
    } else if (rg) selectItem('rel', rg.dataset.rel);
    else if (erdSel) selectItem(null);
  });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest('[data-ent]'), rg = e.target.closest('[data-rel]');
    if (!g && !rg) return;
    const id = g ? g.dataset.ent : rg.dataset.rel;
    const refocus = () => { const el = $(`#erd-svg [data-${g ? 'ent' : 'rel'}="${id}"]`); if (el) el.focus(); };
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectItem(g ? 'ent' : 'rel', id); refocus(); }
    else if (g && e.key.startsWith('Arrow')) {
      e.preventDefault();
      const en = getEnt(id), st = e.shiftKey ? 40 : 10;
      if (e.key === 'ArrowLeft') en.x -= st; if (e.key === 'ArrowRight') en.x += st;
      if (e.key === 'ArrowUp') en.y -= st; if (e.key === 'ArrowDown') en.y += st;
      clampEnt(en); erdChanged(); refocus();
    }
  });
}
window.addEventListener('pointermove', e => {
  if (!drag || !erd) return;
  const en = getEnt(drag.id); if (!en) { drag = null; return; }
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
  drag.moved = true;
  const p = svgPoint(e);
  en.x = Math.round(p.x - drag.dx); en.y = Math.round(p.y - drag.dy); clampEnt(en);
  renderCanvas();
});
window.addEventListener('pointerup', () => { if (drag) { if (drag.moved) { AUDIO.sfx('place'); erdChanged(); } drag = null; } });

/* Tahapan rancangan (stepper). Lima tahap pertama hanya memeriksa KELENGKAPAN;
   tahap Review baru hijau jika evaluasi berbasis studi kasus menyatakan sesuai. */
function erdSteps(){
  const E = erd.entities;
  return [
    ['Entitas', E.length >= 2 && E.every(e => e.name.trim())],
    ['Atribut', E.length > 0 && E.every(e => e.attrs.length >= 2 && e.attrs.every(a => a.name.trim()))],
    ['Primary Key', E.length > 0 && E.every(e => e.attrs.some(a => a.pk))],
    ['Relasi', erd.rels.length > 0 && E.every(e => erd.rels.some(r => r.a === e.id || r.b === e.id))],
    ['Kardinalitas', erd.rels.length > 0 && erd.rels.every(r => r.card)],
    ['Review', !!(erdEval && !erdEval.stale && erdEval.pass)]
  ];
}
function renderSteps(){
  const box = $('#erd-steps'); if (!box || !erd) return;
  const st = erdSteps(), cur = st.findIndex(s => !s[1]);
  box.innerHTML = st.map(([t, ok], i) => `${i ? `<span class="st2-line ${st[i - 1][1] ? 'ok' : ''}"></span>` : ''}<span class="st2 ${ok ? 'ok' : i === cur ? 'cur' : ''}"><i>${ok ? ic('check',14) : i + 1}</i>${t}</span>`).join('');
}
function freeSpot(){
  for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
    const x = 40 + col * 240, y = 40 + row * 220;
    const busy = erd.entities.some(e => { const D = dims(e); return x < e.x + D.w + 30 && e.x < x + 200 && y < e.y + D.h + 30 && e.y < y + 120; });
    if (!busy) return { x, y };
  }
  return { x:40 + Math.round(Math.random() * 600), y:40 + Math.round(Math.random() * 400) };
}
function addEntity(name){
  const p = freeSpot(), en = { id:uid(), name, x:p.x, y:p.y, attrs:[] };
  erd.entities.push(en);
  erdSel = { type:'ent', id:en.id };
  AUDIO.sfx('place'); erdChanged(); renderInspector();
  return en;
}

/* ---------- EVALUASI ERD OTOMATIS (pemeriksaan awal berbasis aturan) ----------
   Membandingkan rancangan dengan kunci studi kasus. Rancangan yang "lengkap"
   tetapi tidak sesuai kebutuhan tetap mendapat skor rendah. */
function canonCard(r){
  if (r.card === '1:N') return { type:'1:N', one:r.a };
  if (r.card === 'N:1') return { type:'1:N', one:r.b };
  return { type:r.card || '' };
}
function evaluateErd(d){
  const c = caseById(d.caseId), fb = [], add = (lvl, text) => fb.push({ lvl, text });
  if (!d.entities.length) return { score:0, parts:{ent:0,attr:0,pk:0,rel:0,card:0}, fb:[{lvl:'err',text:'Belum ada entitas pada kanvas.'}], pass:false };
  // a. validasi dasar: nama kosong / ganda
  const seen = {};
  d.entities.forEach(e => {
    if (!e.name.trim()) add('err', 'Ada entitas tanpa nama. Beri nama setiap entitas.');
    else { const k = norm(e.name); if (seen[k]) add('err', `Nama entitas "${e.name}" dipakai lebih dari sekali.`); seen[k] = 1; }
    const an = {};
    e.attrs.forEach(a => {
      if (!a.name.trim()) add('err', `Entitas ${e.name || '(tanpa nama)'} memiliki atribut kosong.`);
      else { const k = norm(a.name); if (an[k]) add('warn', `Atribut "${a.name}" ditulis dua kali di ${e.name}.`); an[k] = 1; }
    });
  });
  // b. entitas: cocokkan nama dengan sinonim pada kunci
  const map = {}, used = new Set();
  c.entities.forEach(re => {
    const st = d.entities.find(e => !used.has(e.id) && re.syn.includes(norm(e.name)));
    if (st) { map[re.key] = st; used.add(st.id); }
  });
  const entReq = c.entities.length, entFound = Object.keys(map).length;
  if (entFound === entReq) add('ok', `Semua ${entReq} entitas yang dibutuhkan sudah ada.`);
  c.entities.filter(re => !map[re.key]).forEach(re => add('err', `Masih ada entitas yang belum dibuat atau namanya belum sesuai. Petunjuk: ${re.hint}.`));
  const extraEnts = d.entities.filter(e => !used.has(e.id) && e.name.trim());
  extraEnts.forEach(e => {
    const asAttr = c.entities.some(re => re.attrs.some(a => a.syn.includes(norm(e.name))));
    add('warn', asAttr ? `"${e.name}" lebih tepat dijadikan atribut, bukan entitas.` : `Entitas "${e.name}" tidak disebutkan dalam kebutuhan sistem, atau namanya belum sesuai.`);
  });
  // c. atribut
  let attrReq = 0, attrFound = 0;
  c.entities.forEach(re => {
    attrReq += re.attrs.length;
    const st = map[re.key]; if (!st) return;
    const missing = [];
    re.attrs.forEach(ra => { if (st.attrs.some(a => ra.syn.includes(norm(a.name)))) attrFound++; else missing.push(ra.label); });
    if (!missing.length) add('ok', `Atribut ${st.name} sudah lengkap.`);
    else add('warn', `${st.name}: ${re.attrs.length - missing.length} dari ${re.attrs.length} atribut ditemukan. Belum ada: ${missing.join(', ')}.`);
    st.attrs.forEach(a => {
      const k = norm(a.name);
      if (!k || re.attrs.some(ra => ra.syn.includes(k))) return;
      const pkOf = c.entities.find(o => o.key !== re.key && o.attrs.some(ra => ra.pk && ra.syn.includes(k)));
      if (pkOf) { add('info', `"${a.name}" di ${st.name} adalah calon Foreign Key ke ${pkOf.key}. Pada ERD konseptual, FK biasanya baru ditambahkan saat konversi ke tabel.`); return; }
      const owner = c.entities.find(o => o.key !== re.key && o.attrs.some(ra => ra.syn.includes(k)));
      if (owner) add('warn', `Atribut "${a.name}" lebih tepat milik ${owner.key}, bukan ${st.name}.`);
      else add('info', `Atribut "${a.name}" di ${st.name} tidak disebutkan dalam kebutuhan. Tidak salah, tetapi periksa apakah memang diperlukan.`);
    });
  });
  // d. Primary Key
  let pkScore = 0;
  c.entities.forEach(re => {
    const st = map[re.key]; if (!st) return;
    const pks = st.attrs.filter(a => a.pk), want = re.attrs.find(a => a.pk);
    if (!pks.length) { add('err', `${st.name} belum memiliki Primary Key.`); return; }
    const right = pks.some(a => want.syn.includes(norm(a.name)));
    if (pks.length > 1) { add('warn', `${st.name} memiliki ${pks.length} atribut PK. Pada kasus ini cukup satu atribut yang unik.`); if (right) pkScore += 0.5; return; }
    if (right) { pkScore += 1; add('ok', `Primary Key ${st.name} (${pks[0].name}) sudah tepat.`); }
    else add('err', `Primary Key ${st.name} = "${pks[0].name}" kurang tepat: nilainya bisa sama untuk data yang berbeda. Pilih atribut yang pasti unik.`);
  });
  // e. relasi & kardinalitas
  let relFound = 0, cardOk = 0; const matched = new Set();
  c.rels.forEach(rr => {
    const A = map[rr.a], B = map[rr.b];
    if (!A || !B) { add('err', `Relasi ${rr.a}–${rr.b} belum dapat diperiksa karena entitasnya belum lengkap.`); return; }
    const r = d.rels.find(x => !matched.has(x.id) && ((x.a === A.id && x.b === B.id) || (x.a === B.id && x.b === A.id)));
    if (!r) { add('err', `Belum ada relasi antara ${A.name} dan ${B.name}. Petunjuk: ${rr.hint}`); return; }
    matched.add(r.id); relFound++;
    if (!r.name.trim()) add('warn', `Relasi ${A.name}–${B.name} belum diberi nama (gunakan kata kerja).`);
    const cn = canonCard(r);
    if (!cn.type) { add('err', `Kardinalitas relasi ${A.name}–${B.name} belum ditentukan.`); return; }
    const ok = cn.type === rr.type && (rr.type !== '1:N' || cn.one === A.id);
    if (ok) { cardOk++; add('ok', `Relasi ${A.name}–${B.name} dengan kardinalitas ${fmtCard(rr.type)} sudah sesuai.`); }
    else if (cn.type === '1:N' && rr.type === '1:N') add('err', `Arah kardinalitas ${A.name}–${B.name} terbalik. Baca lagi: ${rr.hint}`);
    else add('err', `Kardinalitas ${A.name}–${B.name} (${fmtCard(cn.type)}) belum sesuai. Baca lagi: ${rr.hint}`);
  });
  const extraRels = d.rels.filter(r => !matched.has(r.id));
  extraRels.forEach(r => { const A = getEnt(r.a, d), B = getEnt(r.b, d);
    add('warn', `Relasi ${A ? A.name : '?'}–${B ? B.name : '?'} tidak disebutkan dalam kebutuhan sistem.`); });
  // f. skor berbobot
  const relReq = c.rels.length;
  const parts = {
    ent: Math.max(0, entFound / entReq - 0.1 * extraEnts.length),
    attr: attrReq ? attrFound / attrReq : 0,
    pk: pkScore / entReq,
    rel: Math.max(0, relFound / relReq - 0.2 * extraRels.length),
    card: cardOk / relReq
  };
  const score = Math.round(20 * parts.ent + 25 * parts.attr + 20 * parts.pk + 20 * parts.rel + 15 * parts.card);
  const pass = score >= ERD_PASS && entFound === entReq && cardOk === relReq && pkScore === entReq;
  return { score, parts, fb, pass, caseId:c.id };
}

/* Konversi ERD milik murid menjadi tabel relasional */
function convertErd(d){
  const tables = d.entities.map(e => ({ id:e.id, name:(e.name.trim() || 'TANPA_NAMA').toUpperCase().replace(/\s+/g, '_'),
    cols:e.attrs.filter(a => a.name.trim()).map(a => ({ name:a.name.trim(), pk:a.pk, fk:null })) }));
  const notes = [], T = id => tables.find(t => t.id === id), pkCols = t => t.cols.filter(c => c.pk);
  const addFk = (to, from) => {
    const pks = pkCols(from);
    if (!pks.length) { notes.push(`${from.name} belum memiliki PK, sehingga FK ke ${to.name} belum dapat dibuat.`); return false; }
    pks.forEach(p => { const ex = to.cols.find(c => norm(c.name) === norm(p.name)); if (ex) ex.fk = from.name; else to.cols.push({ name:p.name, pk:false, fk:from.name }); });
    return true;
  };
  d.rels.forEach(r => {
    const A = T(r.a), B = T(r.b); if (!A || !B) return;
    if (r.card === '1:N') { if (addFk(B, A)) notes.push(`${A.name} 1 : N ${B.name} → PK ${A.name} menjadi FK di ${B.name}.`); }
    else if (r.card === 'N:1') { if (addFk(A, B)) notes.push(`${B.name} 1 : N ${A.name} → PK ${B.name} menjadi FK di ${A.name}.`); }
    else if (r.card === '1:1') { if (addFk(B, A)) notes.push(`${A.name} 1 : 1 ${B.name} → PK ${A.name} menjadi FK di ${B.name}.`); }
    else if (r.card === 'M:N') {
      const pa = pkCols(A), pb = pkCols(B);
      if (!pa.length || !pb.length) { notes.push(`Relasi M : N ${A.name}–${B.name} membutuhkan PK pada kedua entitas.`); return; }
      const name = `${A.name}_${B.name}`;
      tables.push({ name, junction:true, cols:[...pa.map(p => ({ name:p.name, pk:true, fk:A.name })), ...pb.map(p => ({ name:p.name, pk:true, fk:B.name }))] });
      notes.push(`${A.name} M : N ${B.name} → dibuat tabel penghubung ${name}.`);
    } else notes.push(`Relasi ${A.name}–${B.name} belum memiliki kardinalitas, sehingga belum dikonversi.`);
  });
  return { tables, notes };
}
function convHtml(conv){
  if (!conv.tables.length) return '<p class="muted">Belum ada entitas untuk dikonversi.</p>';
  return `<div class="conv-grid">${conv.tables.map(t => `<div><div class="tbl-title">${ic('table',16)} ${esc(t.name)} ${t.junction ? '<span class="pill">tabel penghubung</span>' : ''}</div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Kolom</th><th>Keterangan</th></tr></thead><tbody>
    ${t.cols.map(c => `<tr><td class="mono">${esc(c.name)}</td><td>${c.pk ? '<span class="tag-pk">PK</span> ' : ''}${c.fk ? `<span class="tag-fk">FK</span> <span class="small muted">→ ${esc(c.fk)}</span>` : ''}${!c.pk && !c.fk ? '<span class="small muted">–</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Tidak ada kolom</td></tr>'}
    </tbody></table></div></div>`).join('')}</div>
    ${conv.notes.length ? `<ul class="small" style="margin:8px 0 0;padding-left:18px">${conv.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}`;
}

function simCheckKeys(){
  const wrong = [];
  ['SISWA','KELAS','JURUSAN'].forEach(t => {

    def.cols.forEach(c => {
      const want = def.pk === c ? 'PK' : def.fk[c] ? 'FK' : '', got = sim.marks[t][c] || '';
      if (want !== got) wrong.push(`${t}.<b>${c}</b> ditandai ${got || 'tanpa kunci'}: ${KEY_WHY[t + '.' + c]}.`);
    });
  });
  sim.keyFb = { ok:!wrong.length, wrong };
  AUDIO.sfx(wrong.length ? 'wrong' : 'correct');
  if (!wrong.length && !S.tabel.keys) { S.tabel.keys = true; logActivity('Menandai PK & FK dengan benar di simulasi tabel', 'key'); checkBadges(); save(); }
  rerender();
}
function simInsert(){
  const nis = $('#int-nis').value.trim(), nama = $('#int-nama').value.trim(), kel = $('#int-kelas').value.trim().toUpperCase();
  let fb;
  if (!nis || !nama || !kel) fb = { ok:false, text:'<b>Ditolak:</b> semua kolom wajib diisi. Primary Key (nis) tidak boleh kosong (NOT NULL).' };
  else if (!/^\d{4,10}$/.test(nis)) fb = { ok:false, text:'<b>Ditolak:</b> nis harus berupa 4–10 digit angka.' };
  else if (sim.rows.some(r => r[0] === nis)) fb = { ok:false, text:`<b>Ditolak:</b> nis ${esc(nis)} sudah ada. Primary Key harus <b>unik</b>.` };
  else if (!SIM_BASE.KELAS.rows.some(k => k[0] === kel)) fb = { ok:false, text:`<b>Ditolak:</b> id_kelas ${esc(kel)} tidak ada di tabel KELAS. Foreign Key harus merujuk data yang ada (<b>integritas referensial</b>).` };
  else {
    sim.rows.push([nis, nama, '-', kel]); sim.newIdx = sim.rows.length - 1;
    const k = SIM_BASE.KELAS.rows.find(x => x[0] === kel);
    fb = { ok:true, text:`<b>Diterima:</b> ${esc(nama)} ditambahkan ke kelas ${k[1]}. nis unik dan id_kelas ${kel} ada di tabel KELAS.` };
    S.tabel.inserts = (S.tabel.inserts || 0) + 1; save();
  }
  sim.intFb = fb;
  AUDIO.sfx(fb.ok ? 'place' : 'wrong');
  rerender();
  if (!fb.ok) { const f = $('#int-nis'); if (f) { $('#int-nis').value = nis; $('#int-nama').value = nama; $('#int-kelas').value = kel; } }
}

  if (G.lv === 2) { const r = G2[G.round]; G.data = { chips:shuffle(r.chips).map(([t, e]) => ({ t, e, at:null })), sel:null, pairs:r.pairs.map(([a, b, ok]) => ({ a, b, ok, v:false })) }; G.say = 'Ketuk sebuah atribut, lalu ketuk entitas pemiliknya. Setelah itu, centang pasangan entitas yang berelasi.'; }

  else G.say = `<b>Petunjuk:</b> ${hint}`;

}
function gameCheck(){
  let correct = 0, total = 0;
  if (G.lv === 1) {
    const empty = G.data.items.filter(i => !i.v).length;
    if (empty) { toast(`Tandai semua kata terlebih dahulu (${empty} belum).`, 'error'); return; }
    G.data.items.forEach(i => { total++; if (i.v === i.k) correct++; });
  }
  if (G.lv === 2) {
    const empty = G.data.chips.filter(c => !c.at).length;
    if (empty) { toast(`Masih ada ${empty} atribut yang belum ditempatkan.`, 'error'); return; }
    G.data.chips.forEach(c => { total++; if (c.at === c.e) correct++; });
    G.data.pairs.forEach(p => { total++; if (p.v === p.ok) correct++; });
  }
  if (G.lv === 3) {
    const tasks = G3.stages[G.round].tasks, empty = tasks.filter(t => !G.ans[t.id]).length;
    if (empty) { toast(`Masih ada ${empty} pilihan yang belum diisi.`, 'error'); return; }
    tasks.forEach(t => { total++; if (G.ans[t.id] === t.a) correct++; });
  }
  G.score += correct * 10; G.checked = true;
  AUDIO.sfx(correct === total ? 'correct' : 'wrong');
  G.mood = correct === total ? 'ok' : 'err';
  G.say = correct === total ? `<b>Hebat! ${correct}/${total} benar.</b> +${correct * 10} poin. Lanjutkan ke misi berikutnya!`

  logActivity(`Gim Level ${G.lv} (${GAME_LEVELS[G.lv - 1].nama}): skor ${pct}%`, 'game');

                 : `<div class="callout err">${ic('alert',20)}<span>Belum lulus. Butuh minimal ${PASS_PCT}%. Pelajari kembali materi terkait lalu coba lagi.</span></div>`}
      <div class="row"><button class="btn btn-outline" data-act="g-start" data-lv="${G.lv}">${ic('reset',18)} Ulangi Level</button>

  const body = G.lv === 1 ? g1Html() : G.lv === 2 ? g2Html() : g3Html();

function g2Place(i, e){

function quizFinish(){
  Q.score = Math.round(quizCorrect() / QUIZ_COUNT * 100); Q.finished = true;

}

const ACT = {
  'nav': el => navigate(el.dataset.to),
  'mulai': () => { const i = MATERI.findIndex(m => !S.materi[m.id]); materiIdx = i < 0 ? 0 : i; materiTab = 'ringkasan'; navigate('materi'); },
  'back': () => navigate(navStack.pop() || 'beranda', true),
  'notif': () => showNotif(),
  // audio
  'toggle-music': () => {
    S.audio.music = !S.audio.music; save();
    if (S.audio.music) { AUDIO.startMusic(); toast(`${ic('music',18)} Musik latar aktif. Tema berubah sesuai halaman.`); } else { AUDIO.stopMusic(); toast('Musik latar dimatikan.'); }
    updateChrome(); if (currentRoute === 'profil') rerender();
  },
  'toggle-sfx': () => {
    S.audio.sfx = !S.audio.sfx; save();
    if (S.audio.sfx) AUDIO.sfx('success');
    toast(S.audio.sfx ? 'Efek suara aktif.' : 'Efek suara dimatikan.');
    updateChrome(); if (currentRoute === 'profil') rerender();
  },
  'aud-test': () => { const was = S.audio.sfx; S.audio.sfx = true; AUDIO.sfx('correct'); setTimeout(() => { AUDIO.sfx('badge'); S.audio.sfx = was; }, 650); },
  'narr-materi': () => {
    if (NARR.speaking) { NARR.stop(); return; }
    const m = MATERI[materiIdx];
    const text = materiTab === 'ringkasan' ? `Materi ${m.kode}. ${m.judul}. ${plainText(m.isi)}`
      : materiTab === 'contoh' ? `Contoh dalam kehidupan sehari-hari. ${plainText(m.contoh)}`
      : `Cek pemahaman. ${m.soal.q} ${m.soal.opsi.map((o, i) => `Pilihan ${'ABCD'[i]}. ${o}.`).join(' ')}`;
    NARR.speak(text);
  },
  'narr-quiz': () => {
    if (NARR.speaking) { NARR.stop(); return; }
    const it = Q.items[Q.i], q = QUIZ[it.qi];
    NARR.speak(`Soal ${Q.i + 1}. ${q.q} ${it.order.map((oi, p) => `Pilihan ${'ABCD'[p]}. ${q.o[oi]}.`).join(' ')}`);
  },
  'nav-modal': el => { closeModal(); navigate(el.dataset.to); },
  'open-case': el => { if (erd) erdPersist(); erdOpen(el.dataset.id); praktikTab = 'erd'; navigate('praktik'); },
  'open-drawer': () => openDrawer(), 'close-drawer': () => closeDrawer(),
  'modal-close': () => closeModal(),
  'modal-yes': () => { const f = pendingConfirm; closeModal(); if (f) f(); },
  // materi
  'materi-go': el => { materiIdx = +el.dataset.i; materiTab = 'ringkasan'; rerender(); const b = $('.materi-body'); if (b) b.scrollIntoView({ block:'start' }); },
  'materi-step': el => { materiIdx = clamp(materiIdx + (+el.dataset.d), 0, MATERI.length - 1); materiTab = 'ringkasan'; render('materi'); window.scrollTo(0, 0); },
  'materi-tab': el => { materiTab = el.dataset.tab; rerender(); },
  'materi-lanjut': () => {
    const i = MATERI_TABS.findIndex(t => t[0] === materiTab);
    if (i < MATERI_TABS.length - 1) { materiTab = MATERI_TABS[i + 1][0]; rerender(); const b = $('.materi-body'); if (b) b.scrollIntoView({ block:'start' }); return; }
    if (materiIdx === MATERI.length - 1) { navigate('praktik'); return; }
    materiIdx++; materiTab = 'ringkasan'; render('materi'); window.scrollTo(0, 0);
  },
  'materi-jawab': el => answerMateri(+el.dataset.i),
  // praktik
  'praktik-tab': el => { if (praktikTab === 'erd') erdPersist(); praktikTab = el.dataset.tab; rerender(); },
  'praktik-tabel': () => { praktikTab = 'tabel'; navigate('praktik'); },
  'erd-new-ent': () => {
    let n = erd.entities.length + 1; while (erd.entities.some(e => norm(e.name) === 'entitas' + n)) n++;
    addEntity('ENTITAS' + n);
    const f = $('#ent-name'); if (f) { f.focus(); f.select(); }
    toast('Entitas baru ditambahkan. Ganti namanya di panel properti.');
  },
  // palet komponen ERD
  'pal-ent': () => ACT['erd-new-ent'](),
  'pal-attr': () => {
    if (!erd.entities.length) { toast('Tambahkan entitas terlebih dahulu.', 'error'); return; }
    if (!erdSel || erdSel.type !== 'ent') selectItem('ent', erd.entities[0].id);
    const f = $('#new-attr'); if (f) { f.focus(); f.scrollIntoView({ block:'center' }); }
    toast(`Ketik nama atribut untuk ${esc(getEnt(erdSel.id).name || 'entitas ini')}, lalu tekan Enter.`);
  },
  'pal-rel': () => {
    if (erd.entities.length < 2) { toast('Butuh minimal dua entitas untuk membuat relasi.', 'error'); return; }
    if (!erdSel || erdSel.type !== 'ent') { toast('Pilih entitas asal relasi di kanvas terlebih dahulu.', 'error'); return; }
    const f = $('#rel-to'); if (f) { f.focus(); f.scrollIntoView({ block:'center' }); }
    toast('Pilih entitas tujuan, isi nama relasi dan kardinalitas, lalu klik Hubungkan.');
  },
  'pal-card': el => {
    const k = el.dataset.card;
    if (erdSel && erdSel.type === 'rel') {
      const r = getRel(erdSel.id); r.card = k; erdChanged(); renderInspector();
      toast(`Kardinalitas diatur ${fmtCard(k)}${k === '1:N' ? ` (satu ${esc(getEnt(r.a).name)}, banyak ${esc(getEnt(r.b).name)}). Pilih N : 1 di panel properti untuk arah sebaliknya` : ''}.`);
    } else if (erdSel && erdSel.type === 'ent' && $('#rel-card')) { $('#rel-card').value = k; $('#rel-to').focus(); toast(`Kardinalitas ${fmtCard(k)} dipilih untuk relasi baru.`); }
    else toast('Pilih relasi (belah ketupat) di kanvas terlebih dahulu.', 'error');
  },
  'erd-del-sel': () => {
    if (!erdSel) { toast('Pilih entitas atau relasi yang akan dihapus.', 'error'); return; }
    ACT[erdSel.type === 'ent' ? 'erd-del-ent' : 'erd-del-rel']();
  },
  'erd-add-ent-named': () => {
    const f = $('#new-ent'), v = f.value.trim();
    if (!v) { toast('Nama entitas tidak boleh kosong.', 'error'); f.focus(); return; }
    if (erd.entities.some(e => norm(e.name) === norm(v))) { toast(`Entitas "${esc(v)}" sudah ada.`, 'error'); f.focus(); return; }
    addEntity(v); const a = $('#new-attr'); if (a) a.focus();
  },
  'erd-add-attr': () => {
    const e = getEnt(erdSel.id), f = $('#new-attr'), v = f.value.trim();
    if (!v) { toast('Nama atribut tidak boleh kosong.', 'error'); f.focus(); return; }
    if (e.attrs.some(a => norm(a.name) === norm(v))) { toast(`Atribut "${esc(v)}" sudah ada di ${esc(e.name)}.`, 'error'); f.focus(); return; }
    e.attrs.push({ id:uid(), name:v, pk:false }); AUDIO.sfx('place');
    erdChanged(); renderInspector(); const n = $('#new-attr'); if (n) n.focus();
  },
  'erd-pk': el => { const a = getEnt(erdSel.id).attrs.find(x => x.id === el.dataset.id); a.pk = !a.pk; erdChanged(); renderInspector(); const k = $(`.key-btn[data-id="${a.id}"]`); if (k) k.focus(); },
  'erd-del-attr': el => { AUDIO.sfx('delete'); const e = getEnt(erdSel.id); e.attrs = e.attrs.filter(a => a.id !== el.dataset.id); erdChanged(); renderInspector(); },
  'erd-del-ent': () => {
    const e = getEnt(erdSel.id);
    confirmBox('Hapus entitas?', `Entitas <b>${esc(e.name || '(tanpa nama)')}</b> beserta relasinya akan dihapus.`, 'Hapus', () => {
      erd.entities = erd.entities.filter(x => x.id !== e.id); erd.rels = erd.rels.filter(r => r.a !== e.id && r.b !== e.id);
      erdSel = null; AUDIO.sfx('delete'); erdChanged(); renderInspector(); toast('Entitas dihapus.');
    });
  },
  'erd-add-rel': () => {
    const e = getEnt(erdSel.id), to = $('#rel-to').value, name = $('#rel-name').value.trim(), card = $('#rel-card').value;
    if (!to) { toast('Pilih entitas tujuan.', 'error'); return; }
    if (erd.rels.some(r => (r.a === e.id && r.b === to) || (r.b === e.id && r.a === to))) { toast('Relasi antara kedua entitas ini sudah ada. Ubah relasi yang ada.', 'error'); return; }
    if (!card) { toast('Pilih kardinalitas relasi terlebih dahulu.', 'error'); $('#rel-card').focus(); return; }
    const r = { id:uid(), a:e.id, b:to, name, card };
    erd.rels.push(r); erdSel = { type:'rel', id:r.id }; AUDIO.sfx('place'); erdChanged(); renderInspector();
    if (!name) toast('Relasi dibuat. Jangan lupa beri nama relasi (kata kerja).');
  },
  'erd-del-rel': () => { AUDIO.sfx('delete'); erd.rels = erd.rels.filter(r => r.id !== erdSel.id); erdSel = null; erdChanged(); renderInspector(); toast('Relasi dihapus.'); },
  'erd-sel-rel': el => selectItem('rel', el.dataset.id),
  'erd-sel-ent': el => selectItem('ent', el.dataset.id),
  'erd-tidy': () => {
    const n = erd.entities.length, cols = n <= 3 ? Math.max(1, n) : n === 4 ? 2 : 3, colW = (CW - 80) / cols;
    erd.entities.forEach((e, i) => { e.x = Math.round(40 + (i % cols) * colW); e.y = 40 + Math.floor(i / cols) * 330; clampEnt(e); });
    erdChanged(); toast('Posisi entitas dirapikan.');
  },
  'erd-save': () => { erdPersist(); logActivity(`Menyimpan rancangan ERD ${caseById(erd.caseId).judul}`, 'save'); save(); toast(`${ic('save',18)} Rancangan disimpan di peramban ini.`, 'success'); },
  'erd-reset': () => confirmBox('Reset rancangan?', `Rancangan <b>${esc(caseById(erd.caseId).judul)}</b> akan dikembalikan ke kondisi awal.`, 'Reset', () => {
    erd = erdFromStarter(caseById(erd.caseId)); erdSel = null; erdEval = null; erdPersist(); rerender(); toast('Rancangan direset.'); }),
  'erd-check': () => runErdCheck(),
  'erd-check-modal': () => { closeModal(); runErdCheck(); },
  'erd-show': () => showErdResult(),
  // simulasi tabel
  'sim-mode': el => { sim.mode = el.dataset.m; sim.sel = null; sim.trace = null; rerender(); },
  'sim-cell': el => {
    const t = el.dataset.t, r = +el.dataset.r, c = +el.dataset.c;
    if (sim.mode === 'jelajah') sim.sel = { t, r, c };
    else if (sim.mode === 'telusur') sim.trace = { t, r };
    else { toast('Pada mode Tandai Kunci, klik judul kolom.'); return; }
    rerender();
  },
  'sim-head': el => { const t = el.dataset.t, c = el.dataset.c, cur = sim.marks[t][c] || ''; sim.marks[t][c] = cur === '' ? 'PK' : cur === 'PK' ? 'FK' : ''; if (!sim.marks[t][c]) delete sim.marks[t][c]; sim.keyFb = null; rerender(); },
  'sim-check-keys': () => simCheckKeys(),
  'sim-clear-keys': () => { sim.marks = { SISWA:{}, KELAS:{}, JURUSAN:{} }; sim.keyFb = null; rerender(); },
  'sim-restore': () => { sim.rows = SIM_BASE.SISWA.rows.map(r => r.slice()); sim.newIdx = -1; sim.intFb = { ok:true, text:'Data tabel SISWA dikembalikan ke kondisi awal.' }; sim.trace = null; rerender(); },
  // gim
  'g-start': el => gameStart(+el.dataset.lv),
  'g-exit': () => { G = null; rerenderTop(); },
  'g-hint': () => gameHint(), 'g-check': () => gameCheck(), 'g-next': () => gameNext(),
  'g1-set': el => { G.data.items[+el.dataset.i].v = el.dataset.v; rerender(); },
  'g2-chip': el => { const i = +el.dataset.i; G.data.sel = G.data.sel === i ? null : i; rerender(); },
  'g2-back': el => { const c = G.data.chips[+el.dataset.i]; if (G.checked) return; c.at = null; G.data.sel = null; rerender(); },
  'g2-drop': el => { if (G.data.sel == null) { toast('Ketuk salah satu atribut terlebih dahulu.'); return; } g2Place(G.data.sel, el.dataset.e); },
  // kuis
  'quiz-start': () => quizStart(),
  'quiz-pick': el => { const it = Q.items[Q.i]; if (it.ans !== null) return; it.ans = +el.dataset.o; AUDIO.sfx(it.ans === QUIZ[it.qi].a ? 'correct' : 'wrong'); rerender(); },
  'quiz-next': () => { if (Q.i < QUIZ_COUNT - 1) { Q.i++; rerender(); const c = $('.quiz-layout'); if (c) c.scrollIntoView({ block:'start' }); } else quizFinish(); },
  'quiz-restart': () => confirmBox('Mulai ulang kuis?', 'Jawaban pada sesi ini akan dihapus dan soal diacak ulang.', 'Mulai Ulang', quizStart),
  // progres
  'copy-summary': () => copySummary(),
  'reset-progress': () => confirmBox('Hapus semua progres?', 'Materi, rancangan ERD, skor gim, skor kuis, dan lencana di peramban ini akan dihapus. Tindakan ini tidak dapat dibatalkan.', 'Hapus Progres', () => {
    const keep = { nama:S.nama, kelas:S.kelas };
    S = Object.assign(defaultState(), keep); erd = null; erdEval = null; G = null; Q = null; sim = null;
    Object.keys(materiWrong).forEach(k => delete materiWrong[k]);
    save(); rerender(); toast('Semua progres telah dihapus.');
  })
};
function runErdCheck(){
  erdEval = evaluateErd(erd);
  const prev = S.erd.best[erd.caseId];
  S.erd.best[erd.caseId] = Math.max(prev || 0, erdEval.score);
  erdPersist();
  logActivity(`Memeriksa ERD ${caseById(erd.caseId).judul}: skor ${erdEval.score}`, 'grid');
  AUDIO.sfx(erdEval.pass ? 'correct' : 'wrong');
  checkBadges(); save(); renderEval(); renderSteps(); updateChrome();
  const b = $('#erd-eval'); if (b) b.scrollIntoView({ behavior:'smooth', block:'start' });
}

/* Input teks: perubahan langsung diterapkan ke model */
const INP = {
  'ent-name': t => { const e = getEnt(erdSel.id); e.name = t.value; const er = $('#ent-name-err'); if (er) er.hidden = !!t.value.trim(); erdChanged(); },
  'attr-name': t => { const a = getEnt(erdSel.id).attrs.find(x => x.id === t.dataset.id); if (a) { a.name = t.value; erdChanged(); } },
  'rel-name': t => { getRel(erdSel.id).name = t.value; erdChanged(); }
};
/* Select / checkbox */
const CHG = {
  'erd-case': t => { erdPersist(); erdOpen(t.value); rerender(); },
  'erd-notation': t => { S.erd.notation = t.value; save(); erd.entities.forEach(clampEnt); renderCanvas(); toast('Notasi diagram diganti. Klik Rapikan jika ada entitas yang bertumpuk.'); },
  'rel-to-pick': t => { const e = getEnt(erdSel.id), o = getEnt(t.value); const c = $('#rel-card'); if (c) { const v = c.value; c.innerHTML = cardOptions(v, e.name || 'entitas ini', o ? o.name : 'tujuan'); } },
  'rel-a': t => { const r = getRel(erdSel.id); if (t.value === r.b) { toast('Entitas pertama dan kedua harus berbeda.', 'error'); t.value = r.a; return; }
    if (erd.rels.some(x => x.id !== r.id && ((x.a === t.value && x.b === r.b) || (x.b === t.value && x.a === r.b)))) { toast('Relasi antara kedua entitas itu sudah ada.', 'error'); t.value = r.a; return; }
    r.a = t.value; erdChanged(); renderInspector(); },
  'rel-b': t => { const r = getRel(erdSel.id); if (t.value === r.a) { toast('Entitas pertama dan kedua harus berbeda.', 'error'); t.value = r.b; return; }
    if (erd.rels.some(x => x.id !== r.id && ((x.a === t.value && x.b === r.a) || (x.b === t.value && x.a === r.a)))) { toast('Relasi antara kedua entitas itu sudah ada.', 'error'); t.value = r.b; return; }
    r.b = t.value; erdChanged(); renderInspector(); },
  'rel-card': t => { const r = getRel(erdSel.id); r.card = t.value; erdChanged(); const x = $('#card-explain span'); if (x) x.innerHTML = cardExplain(r); },
  'g2-pair': t => { G.data.pairs[+t.dataset.i].v = t.checked; AUDIO.sfx('click'); },
  'aud-sfx': t => { S.audio.sfx = t.checked; save(); if (t.checked) AUDIO.sfx('success'); updateChrome(); },
  'aud-music': t => { S.audio.music = t.checked; save(); if (t.checked) AUDIO.startMusic(); else AUDIO.stopMusic(); updateChrome(); },
  'aud-rate': t => { S.audio.rate = +t.value || 1; save(); },
  'g3-ans': t => { G.ans[t.dataset.id] = t.value; const d = $('#g3-diagram'); if (d) d.innerHTML = g3Diagram(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  const sounds = AUDIO.count;   // bunyi klik hanya jika aksi tidak memutar bunyinya sendiri
  try { fn(el, e); if (AUDIO.count === sounds && !['toggle-sfx','toggle-music','aud-test'].includes(el.dataset.act)) AUDIO.sfx('click'); } catch (err) { console.error(err); toast('Terjadi kesalahan. Coba ulangi langkah terakhir.', 'error'); }
});
document.addEventListener('input', e => {
  const a = e.target.dataset && e.target.dataset.aud;   // slider volume
  if (a) { S.audio[a] = +e.target.value; AUDIO.applyVolume(); const o = $(`#${e.target.id}-val`); if (o) o.textContent = e.target.value + '%'; save(); }
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.aud === 'sfxVol') AUDIO.sfx('click'); });
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.inp; if (k && INP[k] && erd && erdSel) INP[k](e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.chg; if (k && CHG[k]) { try { CHG[k](e.target); } catch (err) { console.error(err); } } });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'int-form') simInsert();
  if (e.target.id === 'profil-form') {
    const n = $('#pf-nama').value.trim(), k = $('#pf-kelas').value.trim();
    if (!n) { $('#pf-err').hidden = false; $('#pf-nama').focus(); return; }
    S.nama = n; S.kelas = k; logActivity('Memperbarui profil', 'user'); save(); rerender(); toast(`${ic('check',18)} Profil disimpan.`, 'success');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else closeDrawer(); return; }
  const t = e.target;
  if (e.key === 'Enter' && t.id === 'new-attr') { e.preventDefault(); ACT['erd-add-attr'](); }
  else if (e.key === 'Enter' && t.id === 'new-ent') { e.preventDefault(); ACT['erd-add-ent-named'](); }
  else if ((e.key === 'Enter' || e.key === ' ') && t.dataset && t.dataset.act && t.tagName === 'TD') { e.preventDefault(); t.click(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
/* Seret-lepas atribut pada gim Level 2 (mouse) */
document.addEventListener('dragstart', e => { const i = e.target.dataset && e.target.dataset.dragi; if (i != null && G && G.lv === 2) { G.data.sel = +i; e.dataTransfer.setData('text/plain', i); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d && G && G.lv === 2) { e.preventDefault(); const i = +e.dataTransfer.getData('text/plain'); g2Place(isNaN(i) ? G.data.sel : i, d.dataset.drop); } });

/* ---------- Mulai aplikasi ---------- */
buildShell();
checkBadges(true);
render(ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : 'beranda');
</script>
</body>
</html>
