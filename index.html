<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB MASTER LAB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Laboratorium Maya dan Gim Edukasi Perancangan Basis Data untuk murid kelas XI RPL/PPLG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* =========================================================
   DB MASTER LAB — gaya tampilan
   Konsep tata letak: sidebar navy tetap + panel konten putih
   (laboratorium digital). Di layar kecil: sidebar jadi laci
   (drawer) + navigasi bawah.
   ========================================================= */
:root{
  --navy:#0B1F4B; --navy-2:#132C66; --navy-3:#1B3A80; --night:#081634;
  --blue:#1E5EFF; --blue-ink:#1645C9; --blue-soft:#E8EFFF;
  --cyan:#0891B2; --cyan-soft:#E0F6FB;
  --green:#15803D; --green-2:#22C55E; --green-soft:#E3F7EA;
  --yellow:#F5B800; --yellow-soft:#FFF5D6;
  --pink:#D9366F; --pink-soft:#FDE7EF;
  --purple:#6D4AE8; --purple-soft:#EEE9FF;
  --red:#C62828; --red-soft:#FDECEC;
  --bg:#F1F4FA; --panel:#FFFFFF; --line:#DCE3F0; --line-2:#C7D2E6;
  --ink:#0E1C3B; --muted:#4F5D78; --faint:#7A86A0;
  --f-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(11,31,75,.06),0 6px 18px rgba(11,31,75,.06);
  --side-w:248px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kerangka aplikasi ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px 18px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.5px;line-height:1.1;display:block}
.brand small{display:block;font-size:11px;color:#9FB6E8;letter-spacing:1.5px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 14px;border:0;border-radius:12px;background:transparent;color:#C9D6F2;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(30,94,255,.35)}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:0;color:#fff;cursor:pointer;text-align:left;width:100%}
.side-user:hover{background:rgba(255,255,255,.1)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none}
.side-user small{display:block;color:#9FB6E8;font-size:12px}
.side-user span{font-weight:700;font-size:14px;display:block;line-height:1.2}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(241,244,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-toggle{display:none}
.top-progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.top-progress .bar{width:120px}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;min-height:44px}
.user-chip .avatar{width:34px;height:34px;font-size:14px}
.user-chip b{font-size:13px;display:block;line-height:1.1}
.user-chip small{font-size:11px;color:var(--muted)}
.content{width:100%;max-width:1240px;margin:0 auto;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Komponen umum ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:17px}
.section-title{font-size:19px;display:flex;align-items:center;gap:10px}
.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--blue-ink)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-ink)}
.btn-outline{background:var(--panel);color:var(--blue-ink);border-color:var(--line-2)}
.btn-outline:hover{border-color:var(--blue);background:var(--blue-soft)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#116632}
.btn-danger{background:var(--panel);color:var(--red);border-color:#F1C4C4}
.btn-danger:hover{background:var(--red-soft)}
.btn-yellow{background:var(--yellow);color:var(--navy)}
.btn-yellow:hover{background:#FFC928}
.btn-ghost-light{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25)}
.btn-ghost-light:hover{background:rgba(255,255,255,.16)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn.danger:hover{color:var(--red);background:var(--red-soft);border-color:#F1C4C4}
.bar{height:10px;border-radius:999px;background:#E3E9F5;overflow:hidden;flex:1}
.bar>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--green-2));width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.dark{background:rgba(255,255,255,.14)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--yellow-soft);color:#7A5600}
.pill.err{background:var(--red-soft);color:var(--red)}
.pill.gray{background:#EDF0F6;color:var(--muted)}
.tag-pk,.tag-fk{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;vertical-align:1px}
.tag-pk{background:var(--yellow-soft);color:#7A5600;border:1px solid #F0D58A}
.tag-fk{background:var(--cyan-soft);color:#0B6A84;border:1px solid #A9DFEC}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--blue-soft);color:#1C2F5C;font-size:14px;align-items:flex-start}
.callout.warn{background:var(--yellow-soft);color:#5E4300}
.callout.ok{background:var(--green-soft);color:#14532D}
.callout.err{background:var(--red-soft);color:#7F1D1D}
.callout .ic{margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:#E6ECF7;padding:5px;border-radius:14px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;padding:9px 16px;min-height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab.active{background:var(--panel);color:var(--blue-ink);box-shadow:var(--shadow)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:14px;color:var(--ink)}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,94,255,.18)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
.err-text{color:var(--red);font-size:13px;font-weight:600}

/* tabel data */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table.data{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.data th{background:#EEF2FA;text-align:left;padding:9px 12px;font-family:var(--f-mono);font-size:12.5px;color:var(--navy);white-space:nowrap;border-bottom:1px solid var(--line)}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
.tbl-title{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:8px}

/* ---------- Beranda ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:34px 36px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px}
.hero h1{color:#fff;font-size:42px;font-weight:800;letter-spacing:.5px}
.hero .lead{font-size:18px;color:#DCE6FF;font-weight:600;margin-top:6px}
.hero p.desc{color:#B9C9EC;margin-top:12px;max-width:56ch}
.hero .tagline{color:var(--yellow);font-style:italic;font-weight:600;margin-top:12px;font-size:16px}
.hero .row{margin-top:22px}
.hero .eyebrow{color:#8FB2FF}
.hero-art{width:100%;max-width:420px;justify-self:center}
.hero-art svg{width:100%;height:auto;display:block}
.float{animation:float 5s ease-in-out infinite}
.float.d2{animation-delay:-2.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.draw{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 3.2s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:160}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.2}}
.game,#erd-eval,.materi-body,.quiz-layout{scroll-margin-top:90px}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.menu-card{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;min-height:170px}
.menu-card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 24px rgba(11,31,75,.1)}
.menu-card .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.menu-card b{font-family:var(--f-display);font-size:16px}
.menu-card span{font-size:13.5px;color:var(--muted)}
.menu-card .pill{margin-top:auto}
.tp-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.big-num{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;color:var(--navy)}
.mini-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-stat{background:#F5F7FC;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.mini-stat b{display:block;color:var(--ink);font-size:16px;font-family:var(--f-display)}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:j}
.journey button{border:1px dashed var(--line-2);border-radius:14px;background:#FAFBFE;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:44px}
.journey button:hover{border-color:var(--blue);background:var(--blue-soft)}
.journey b{font-size:14px}
.journey span{font-size:12.5px;color:var(--muted)}
.journey i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--blue-ink);font-weight:600}

/* ---------- Materi ---------- */
.materi-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.materi-nav{position:sticky;top:84px;padding:14px;display:flex;flex-direction:column;gap:4px}
.materi-nav h3{font-size:14px;padding:6px 8px 10px;color:var(--muted)}
.mn-btn{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;font-weight:600;font-size:14px;color:var(--ink);min-height:44px}
.mn-btn:hover{background:#F2F5FC}
.mn-btn.active{background:var(--blue-soft);color:var(--blue-ink)}
.mn-btn .code{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#EDF1F9;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.mn-btn.active .code{background:var(--blue);color:#fff}
.mn-btn.done .code{background:var(--green);color:#fff}
.mn-btn .t{flex:1;min-width:0}
.materi-body{display:flex;flex-direction:column;gap:22px;padding:28px}
.materi-body h2{font-size:26px}
.materi-body section{display:flex;flex-direction:column;gap:10px}
.materi-body h3{font-size:16px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.materi-body p,.materi-body li{max-width:72ch}
.materi-body ul,.materi-body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.ilus{background:#F7F9FD;border:1px solid var(--line);border-radius:var(--r-md);padding:18px;overflow-x:auto}
.ilus svg{display:block;max-width:100%;height:auto;margin:0 auto}
.contoh{background:var(--cyan-soft);border-radius:var(--r-md);padding:16px 18px}
.contoh h3{color:#075E74}
.def{border-left:0;background:var(--yellow-soft);border-radius:var(--r-md);padding:12px 16px;font-weight:600;color:#4A3500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:50px;padding:11px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;cursor:pointer;font-size:14.5px;font-weight:600;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--blue);background:#F6F9FF}
.opt .letter{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;flex:none}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt[disabled]{cursor:default}
.feedback{border-radius:12px;padding:12px 16px;font-size:14px;animation:fadeUp .25s ease both}
.feedback.ok{background:var(--green-soft);color:#14532D}
.feedback.err{background:var(--red-soft);color:#7F1D1D}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* mini tabel ilustrasi */
.mini-tbl{border-collapse:collapse;font-size:13px;background:#fff;margin:0 auto}
.mini-tbl th,.mini-tbl td{border:1px solid var(--line-2);padding:6px 12px;font-family:var(--f-mono);white-space:nowrap}
.mini-tbl th{background:#EAF0FB}
.mini-tbl .hl-row td{background:#FFF1BF;animation:pulseRow 2.6s ease-in-out infinite}
.mini-tbl .hl-col{background:#D7F0FF!important}
.mini-tbl .dup{background:var(--red-soft);color:var(--red);font-weight:600}
.mini-tbl .key{background:var(--yellow-soft);font-weight:700}
@keyframes pulseRow{0%,100%{background:#FFF1BF}50%{background:#FFE48A}}
.lbl-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.ent-chip{padding:8px 14px;border-radius:8px;background:var(--navy);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:13px}
.attr-chip{padding:7px 14px;border-radius:999px;background:var(--yellow-soft);border:1px solid #F0D58A;color:#5E4300;font-family:var(--f-mono);font-size:13px}
.no-chip{padding:7px 14px;border-radius:999px;background:#EDF0F6;color:var(--muted);font-size:13px;text-decoration:line-through}
.fk-demo{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.fk-arrow{color:var(--cyan);font-family:var(--f-mono);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center}
.fk-arrow svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

/* ---------- Praktik / ERD ---------- */
.erd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.erd-toolbar label.field{min-width:240px;flex:1;max-width:360px}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:#F0F3FA;font-size:13px;font-weight:700;color:var(--muted)}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line-2);font-style:normal;font-size:12px}
.step.ok{background:var(--green-soft);color:var(--green)}
.step.ok i{background:var(--green);border-color:var(--green);color:#fff}
.erd-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.canvas-card{padding:12px}
.canvas-scroll{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#FBFCFF}
#erd-svg{display:block;width:100%;min-width:760px;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#erd-svg .ent{cursor:grab}
#erd-svg .ent:focus{outline:none}
#erd-svg .ent:focus .ent-box{stroke:var(--yellow);stroke-width:3}
#erd-svg .rel{cursor:pointer}
.canvas-hint{font-size:12.5px;color:var(--muted);padding:8px 4px 0}
.insp{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.insp h3{display:flex;align-items:center;gap:8px}
.insp h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-family:var(--f-body)}
.insp hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.attr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.attr-list li{display:flex;gap:6px;align-items:center}
.attr-list input{flex:1;min-width:0;min-height:40px;font-family:var(--f-mono);font-size:13px}
.key-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--faint);flex:none}
.key-btn.on{background:var(--yellow);border-color:#D9A200;color:var(--navy)}
.rel-mini{display:flex;flex-direction:column;gap:6px}
.rel-mini button{justify-content:flex-start}
.case-box{background:#F7F9FD;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.case-box b{color:var(--navy)}
.eval-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score-ring{width:110px;height:110px;flex:none;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--navy)}
.crit{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.crit span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fb-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:9px 12px;border-radius:10px;background:#F7F9FD}
.fb-list li .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;margin-top:1px}
.fb-list li.ok .dot{background:var(--green)}
.fb-list li.warn .dot{background:#B7791F}
.fb-list li.err .dot{background:var(--red)}
.fb-list li.info .dot{background:var(--cyan)}
.conv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* simulasi tabel */
.sim-tables{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sim-tables .tbl-wrap{background:#fff}
table.sim td,table.sim th{cursor:pointer}
table.sim th button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center}
table.sim th button:focus-visible{outline:3px solid var(--yellow)}
table.sim td.hl-r{background:#FFF4CC}
table.sim td.hl-c{background:#DDF2FF}
table.sim td.hl-r.hl-c{background:#FFD95E}
table.sim tr.trace td{background:#DFF7E8}
table.sim tr.trace td:first-child{box-shadow:inset 4px 0 0 var(--green)}
table.sim td.new{animation:newRow 1.4s ease}
@keyframes newRow{from{background:#C9F2D6}to{background:transparent}}
.info-box{border-radius:12px;padding:12px 16px;background:#0E2457;color:#E3EBFF;font-size:14px;min-height:48px}
.info-box b{color:var(--yellow)}
.key-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* ---------- Gim ---------- */
.game{background:var(--night);color:#E4ECFF;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:18px;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
.game h2,.game h3,.game h4{color:#fff}
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 16px}
.hud .lv{display:flex;align-items:center;gap:10px;font-weight:700}
.hud .lv i{font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.hud .prog{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;font-size:13px}
.hud .score{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--yellow)}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.mission{background:#fff;color:var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.mission h3{color:var(--ink);display:flex;gap:8px;align-items:center}
.mission .story{background:#F4F7FD;border-radius:12px;padding:12px 14px;font-size:14px}
.mascot-box{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:84px}
.bubble{background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;font-size:14px;position:relative;width:100%;box-shadow:0 8px 20px rgba(0,0,0,.25);min-height:70px}
.bubble:after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.ok{background:#E9FBEF}
.bubble.ok:after{border-top-color:#E9FBEF}
.bubble.err{background:#FFF0F0}
.bubble.err:after{border-top-color:#FFF0F0}
.robot{width:170px;animation:float 4s ease-in-out infinite}
.robot .eye{animation:blinkEye 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.level-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.level-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.level-card.locked{opacity:.75}
.level-card .num{font-family:var(--f-mono);color:#8FB2FF;font-size:12px;font-weight:600;letter-spacing:1px}
.level-card p{color:#B9C9EC;font-size:13.5px}
.stars{display:flex;gap:3px;color:#40507A}
.stars .on{color:var(--yellow)}
.item-rows{display:flex;flex-direction:column;gap:8px}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);flex-wrap:wrap}
.item-row .t{flex:1;font-weight:700;min-width:120px}
.item-row.ok{border-color:var(--green);background:var(--green-soft)}
.item-row.bad{border-color:var(--red);background:var(--red-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;min-height:40px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on-e{background:var(--navy);color:#fff}
.seg button.on-a{background:var(--yellow);color:var(--navy)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line-2);border-radius:12px;background:#FAFBFE}
.chip{border:1px solid #F0D58A;background:var(--yellow-soft);color:#5E4300;border-radius:999px;padding:7px 14px;font-family:var(--f-mono);font-size:13px;font-weight:600;cursor:grab;min-height:38px}
.chip.sel{background:var(--yellow);border-color:#C99700;color:var(--navy);box-shadow:0 0 0 3px rgba(245,184,0,.35)}
.chip.ok{background:var(--green-soft);border-color:var(--green);color:#14532D}
.chip.bad{background:var(--red-soft);border-color:var(--red);color:#7F1D1D}
.drop-ents{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.drop{border:2px solid var(--navy);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;min-height:130px}
.drop .h{background:var(--navy);color:#fff;font-family:var(--f-mono);font-weight:600;padding:8px 12px;font-size:13.5px}
.drop .b{display:flex;flex-wrap:wrap;gap:6px;padding:10px;flex:1;align-content:flex-start}
.drop.over,.drop.target{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,94,255,.25)}
.pair-list{display:flex;flex-direction:column;gap:8px}
.pair{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;min-height:46px}
.pair input{width:20px;height:20px;accent-color:var(--blue)}
.pair.ok{border-color:var(--green);background:var(--green-soft)}
.pair.bad{border-color:var(--red);background:var(--red-soft)}
.task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.task{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.task.ok{border-color:var(--green);background:var(--green-soft)}
.task.bad{border-color:var(--red);background:var(--red-soft)}
.task b{font-size:14px}
.badge-earn{display:flex;align-items:center;gap:14px;background:rgba(245,184,0,.12);border:1px solid rgba(245,184,0,.4);border-radius:16px;padding:14px}

/* ---------- Kuis ---------- */
.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.q-num{font-family:var(--f-mono);font-size:13px;color:var(--blue-ink);font-weight:600}
.q-text{font-size:18px;font-weight:700;font-family:var(--f-display);line-height:1.45}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dots span{height:34px;border-radius:8px;background:#EDF1F9;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.dots span.cur{outline:2px solid var(--blue);color:var(--blue-ink)}
.dots span.ok{background:var(--green);color:#fff}
.dots span.bad{background:var(--red);color:#fff}
.rekap{display:flex;flex-direction:column;gap:12px}
.rekap-item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rekap-item.ok{border-left:0;background:#F6FCF8}
.rekap-item.bad{background:#FFF8F8}

/* ---------- Progres ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px;border-radius:16px;border:1px solid var(--line);background:#fff}
.badge .medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--yellow) 60%,#C99200);color:var(--navy);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 0 0 4px #FFF2C2}
.badge.locked .medal{background:#E3E8F2;color:#8C97AE;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.badge b{font-size:13.5px}
.badge span{font-size:12px;color:var(--muted)}
.check-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.check-list li{display:flex;gap:10px;align-items:center;font-size:14px}
.check-list .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:#E3E9F5;color:#fff}
.check-list li.done .ck{background:var(--green)}
.activity{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.activity li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.activity small{display:block;color:var(--muted);font-size:12px}
.activity .ai{width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;flex:none}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,22,52,.55);z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:#fff;border-radius:20px;max-width:900px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;animation:fadeUp .2s ease both}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:center;gap:10px}
.modal-head h3{flex:1}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:fadeUp .25s ease both}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.medal{background:#1B1500;color:#FFE08A;border:1px solid var(--yellow)}

/* ---------- Navigasi bawah (mobile) ---------- */
.bottom-nav{display:none}
.scrim{display:none}

/* ---------- Responsif ---------- */
@media (min-width:1600px){ body{font-size:16px} .content{max-width:1440px} :root{--side-w:270px} }
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .erd-layout{grid-template-columns:minmax(0,1fr)}
  .insp{position:static;max-height:none}
  .sim-tables{grid-template-columns:repeat(2,minmax(0,1fr))}
  .journey{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(8,22,52,.45);z-index:35}
  .menu-toggle{display:inline-grid}
  .top-progress{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottom-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px;min-height:52px;cursor:pointer;border-radius:10px}
  .bottom-nav button.active{color:var(--blue-ink);background:var(--blue-soft)}
  .content{padding-bottom:100px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .materi-layout{grid-template-columns:minmax(0,1fr)}
  .materi-nav{position:static;flex-direction:row;overflow-x:auto;gap:6px}
  .materi-nav h3{display:none}
  .mn-btn{flex:none}
  .mn-btn .t{display:none}
  .game-layout,.quiz-layout{grid-template-columns:minmax(0,1fr)}
  .mascot-box{position:static;flex-direction:row;align-items:flex-end}
  .robot{width:110px}
  .bubble:after{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:320px}
}
@media (max-width:700px){
  .g2,.g3,.g4,.level-cards,.key-cards,.sim-tables{grid-template-columns:minmax(0,1fr)}
  .journey{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:24px 20px}
  .hero h1{font-size:32px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .user-chip .uc-text{display:none}
  .user-chip{padding:4px}
  .card{padding:16px}
  .materi-body{padding:18px}
  .crit{grid-template-columns:110px minmax(0,1fr) 48px}
  .mascot-box{flex-direction:column;align-items:center}
  #erd-svg{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* =========================================================
   v2 — penyesuaian mengikuti desain referensi DB MASTER LAB
   ========================================================= */
/* Topbar: tombol kembali, notifikasi, profil */
.top-logo{display:none}
.bell{position:relative}
.bell .dotn{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.user-chip .chev{color:var(--muted);margin-left:2px}
.icon-btn.on{background:var(--blue-soft);color:var(--blue-ink);border-color:#9DB7FF}
.switch-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.switch-row input{width:22px;height:22px;accent-color:var(--blue);margin-top:2px;flex:none}
.switch-row small{display:block;color:var(--muted);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--blue);min-height:32px}
/* Beranda */
.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);padding:30px 34px}
.hero h1{font-size:40px}
.hero-art{max-width:480px}
.hero-img{display:block;width:100%;height:auto;aspect-ratio:123/74;border:0;background:transparent}
.hero-art{margin:-20px -24px -20px 0}
.menu-card{flex-direction:row;align-items:flex-start;gap:14px;min-height:0;padding:18px}
.menu-card .mc-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.menu-card .mc-body b{color:var(--ink)}
.menu-card .pill{margin-top:6px;align-self:flex-start}
.proj{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.proj .pi{width:48px;height:48px;border-radius:12px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center;flex:none}
.btn-green{background:#16A34A;color:#fff}
.btn-green:hover{background:#15803D}
.journey{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.band{background:var(--navy);color:#fff;border-radius:20px;padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.band .bl{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--yellow);white-space:nowrap}
.band .bt{font-style:italic;color:#DCE6FF;flex:1;min-width:220px;font-size:16px}
.band .bf{display:flex;gap:4px;flex-wrap:wrap}
.band .bf button{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#DCE6FF;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:10px;cursor:pointer;text-align:left;line-height:1.25;min-height:44px}
.band .bf button:hover{background:rgba(255,255,255,.08);color:#fff}
.band .bf i{width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-style:normal;flex:none}
/* Materi bertab */
.materi-wrap{display:flex;flex-direction:column;gap:14px;min-width:0}
.topic-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;min-width:0}
.topic{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px 7px 7px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;min-height:44px;color:var(--ink);flex:none}
.topic:hover{border-color:var(--blue)}
.topic .code{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#EDF1F9;font-family:var(--f-mono);font-size:12px;flex:none}
.topic.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.topic.active .code{background:var(--blue);color:#fff}
.topic.done .code{background:var(--green);color:#fff}
.m-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.m-head>div:first-child{min-width:min(100%,240px)}
.m-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.m-cols>section{min-width:0}
/* ERD Builder: stepper bernomor, palet komponen, tombol bawah kanvas */
.stepper2{display:flex;align-items:center;margin-top:16px;overflow-x:auto;padding:4px 2px}
.st2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.st2 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:#fff;font-style:normal;font-size:13px}
.st2.cur{color:var(--blue-ink)}
.st2.cur i{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(30,94,255,.16)}
.st2.ok{color:var(--green)}
.st2.ok i{background:var(--green);border-color:var(--green);color:#fff}
.st2-line{flex:1;min-width:22px;height:2px;background:var(--line-2);margin:0 10px}
.st2-line.ok{background:var(--green)}
/* Lebar < 1500px: palet menjadi baris di atas kanvas agar area kerja tetap luas */
.erd-layout{grid-template-columns:minmax(0,1fr) 316px}
.palette{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;grid-column:1;grid-row:1}
.palette p{display:none}
.canvas-card{grid-column:1;grid-row:2}
.erd-layout>.insp{grid-column:2;grid-row:1 / span 2}
.palette h4{font-size:13px;color:var(--navy)}
.pal-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);text-align:left}
.pal-btn:hover{border-color:var(--blue);background:var(--blue-soft)}
.pal-btn svg{flex:none}
.pal-sep{border-left:1px solid var(--line);align-self:stretch;margin:0 4px}
@media (min-width:1500px){
  .erd-layout{grid-template-columns:170px minmax(0,1fr) 316px}
  .palette{flex-direction:column;align-items:stretch;position:sticky;top:84px;grid-column:1;grid-row:1}
  .palette p{display:block}
  .pal-sep{border-left:0;border-top:1px solid var(--line);margin:4px 0}
  .canvas-card{grid-column:2;grid-row:1}
  .erd-layout>.insp{grid-column:3;grid-row:1}
}
.rel-mini .btn{white-space:normal;text-align:left;height:auto;line-height:1.35}
.canvas-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:10px}
/* Diagram skema tabel */
.schema-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.schema-cols>div{min-width:0}
/* Gim: kartu misi gelap + HUD */
.hud-star{width:42px;height:42px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;flex:none}
.hud-main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.hud-main b{color:#fff}
.mission{background:#0F2559;color:#E4ECFF;border:1px solid rgba(255,255,255,.12)}
.mission h3,.mission h4{color:#fff}
.mission .story{background:rgba(255,255,255,.07);color:#DCE6FF}
.mission .muted{color:#B9C9EC}
.mission .big-num{color:#fff}
.mission-tag{display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;letter-spacing:.6px;align-self:flex-start}
.item-row{background:#fff;color:var(--ink);border-color:transparent}
.item-row.ok{background:#DDF7E6;border-color:#22C55E}
.item-row.bad{background:#FFE4E4;border-color:#EF4444}
.pair{background:#fff;color:var(--ink);border-color:transparent}
.pair.ok{background:#DDF7E6;border-color:#22C55E}
.pair.bad{background:#FFE4E4;border-color:#EF4444}
.task{background:#fff;color:var(--ink);border-color:transparent}
.task.ok{background:#DDF7E6;border-color:#22C55E}
.task.bad{background:#FFE4E4;border-color:#EF4444}
.pool{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3)}
.drop{border-color:#8FB2FF}
/* Kuis: opsi radio + panel jawaban */
.quiz-opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;background:#fff}
.quiz-opt .ol{font-weight:800;color:var(--muted);min-width:20px}
.quiz-opt.correct .radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .radio{border-color:var(--red);background:var(--red)}
.quiz-opt.correct .radio::after,.quiz-opt.wrong .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.answer-box{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.ans-pick{font-size:16px}
.ans-pick.ok{color:var(--green)}
.ans-pick.bad{color:var(--red)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.verdict.ok{color:var(--green)}
.verdict.bad{color:var(--red)}
.explain{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#14532D}
.explain.bad{background:var(--red-soft);color:#7F1D1D}
/* Progres: sapaan, kartu statistik, medali */
.hello{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hello h2{font-size:24px}
.hello .lvbox{min-width:240px;flex:1;max-width:420px;margin-left:auto}
.stat-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat-card{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);cursor:pointer;min-width:0;color:var(--ink)}
.stat-card:hover{border-color:var(--blue)}
.stat-card .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.stat-card .sb{display:flex;flex-direction:column;min-width:0}
.stat-card .sb b{font-family:var(--f-display);font-size:22px;line-height:1.25}
.medals{display:flex;gap:14px;flex-wrap:wrap}
.medal-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:112px;text-align:center;font-size:12.5px}
.medal-item .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--yellow) 60%,#C99200);color:var(--navy);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 0 0 4px #DCE6FF}
.medal-item.locked .medal{background:#E3E8F2;color:#8C97AE;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.medal-item b{font-size:12.5px;line-height:1.3}

@media (max-width:1180px){
  .erd-layout{grid-template-columns:minmax(0,1fr)}
  .palette,.canvas-card,.erd-layout>.insp{grid-column:1;grid-row:auto}
  .pal-sep{display:none}
  .m-cols,.schema-cols{grid-template-columns:minmax(0,1fr)}
  .stat-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .topbar{background:var(--navy);border-bottom:0;color:#fff}
  .topbar h2{color:#fff}
  .topbar .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
  .top-logo{display:inline-flex}
  .top-logo svg{width:32px;height:32px}
  .user-chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
  .user-chip small,.user-chip .chev{color:#B9C9EC}
  .topbar .icon-btn.on{background:rgba(30,94,255,.45);border-color:#8FB2FF}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--navy)}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .back-btn,#sfx-btn,.top-logo{display:none}
  .user-chip .chev{display:none}
  .stat-cards{grid-template-columns:minmax(0,1fr)}
  .hello .lvbox{max-width:none;margin-left:0}
  .band .bf button{flex:1 1 45%}
}
</style>

/* ---------- Pembantu ilustrasi kardinalitas ---------- */
function cardSvg(left, right, nl, nr, links, label){
  const W = 230, H = 170, ys = n => n === 1 ? [90] : Array.from({length:n}, (_, i) => 42 + i * 96 / (n - 1));
  const yl = ys(nl), yr = ys(nr);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Contoh kardinalitas ${label}">`;

  s += `<text x="45" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#0B1F4B" font-family="JetBrains Mono,monospace">${left}</text>`;
  s += `<text x="185" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#5E4300" font-family="JetBrains Mono,monospace">${right}</text>`;
  links.forEach(([a, b], i) => { s += `<line class="draw" style="animation-delay:${i*0.25}s" x1="52" y1="${yl[a]}" x2="178" y2="${yr[b]}" stroke="#1E5EFF" stroke-width="2.2"/>`; });
  yl.forEach((y, i) => { s += `<circle cx="45" cy="${y}" r="9" fill="#0B1F4B"/><text x="45" y="${y+4}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">${i+1}</text>`; });
  yr.forEach((y, i) => { s += `<circle cx="185" cy="${y}" r="9" fill="#F5B800"/><text x="185" y="${y+4}" text-anchor="middle" font-size="10" fill="#0B1F4B" font-weight="700">${String.fromCharCode(97+i)}</text>`; });
  s += `<text x="115" y="${H-6}" text-anchor="middle" font-size="14" font-weight="800" fill="#0B1F4B" font-family="Poppins,sans-serif">${label}</text></svg>`;
  return s;
}

  contoh:`<p>Sebelum membuat aplikasi perpustakaan sekolah, tim RPL menggambar ERD dulu agar guru pustakawan bisa memeriksa: apakah data anggota, buku, dan peminjaman sudah lengkap? ERD membantu menemukan kesalahan rancangan sebelum kode ditulis.</p>`,

{
  id:'c', kode:'C', judul:'Entitas',
  isi:`<p><b>Entitas</b> adalah objek di dunia nyata yang datanya perlu disimpan dan dapat dibedakan satu sama lain. Entitas dapat berupa <b>orang</b> (siswa, guru), <b>benda</b> (buku, alat), <b>tempat</b> (ruang, gedung), atau <b>kejadian</b> (peminjaman, transaksi).</p>
  <p>Cara menemukan entitas: baca deskripsi sistem, lalu cari <b>kata benda</b> yang memiliki banyak keterangan dan muncul berkali-kali. Keterangan kecil seperti "harga" atau "warna" biasanya <b>atribut</b>, bukan entitas.</p>
  <p class="def">Nama entitas ditulis dengan kata benda tunggal, misalnya SISWA (bukan PARA SISWA).</p>`,
  ilus:`<div class="stack" style="align-items:center">
    <div class="small muted">Studi kasus kantin sekolah</div>
    <div class="lbl-chips" style="margin-top:0"><span class="ent-chip">STAN</span><span class="ent-chip">MENU</span><span class="ent-chip">TRANSAKSI</span></div>
    <div class="small muted" style="margin-top:6px">Ini atribut, bukan entitas:</div>
    <div class="lbl-chips" style="margin-top:0"><span class="attr-chip">harga</span><span class="attr-chip">nama_menu</span><span class="attr-chip">tanggal</span></div>
    <div class="small muted" style="margin-top:6px">Tidak perlu disimpan sama sekali:</div>
    <div class="lbl-chips" style="margin-top:0"><span class="no-chip">warna meja kantin</span><span class="no-chip">suasana ramai</span></div></div>`,
  contoh:`<p>Di kantin sekolah ada stan-stan penjual, setiap stan menjual menu, dan setiap pembelian dicatat sebagai transaksi. Maka entitasnya: <b>STAN</b>, <b>MENU</b>, dan <b>TRANSAKSI</b>.</p>`,
  soal:{ q:'Pada sistem perpustakaan sekolah, manakah yang paling tepat dijadikan entitas?', opsi:['Judul buku','BUKU','Warna sampul','Tanggal kembali'], benar:1,
    ok:'Tepat! BUKU memiliki banyak keterangan (kode, judul, pengarang), jadi ia entitas. Judul dan tanggal adalah atribut.', hint:'Cari objek yang memiliki banyak keterangan, bukan keterangannya.' }
},
{
  id:'d', kode:'D', judul:'Atribut',
  isi:`<p><b>Atribut</b> adalah sifat atau keterangan yang dimiliki entitas. Contoh atribut SISWA: <span class="mono">nis, nama, tgl_lahir, alamat</span>.</p>
  <ul>
    <li><b>Atribut kunci</b> (<i>key</i>): nilainya unik, digaris bawah. Contoh: <span class="mono">nis</span>.</li>
    <li><b>Atribut komposit</b>: dapat dipecah lagi. Contoh: <span class="mono">alamat</span> → jalan, kota.</li>
    <li><b>Atribut bernilai banyak</b> (<i>multivalued</i>): bisa lebih dari satu nilai, digambar oval ganda. Contoh: <span class="mono">no_telp</span>.</li>
    <li><b>Atribut turunan</b> (<i>derived</i>): dihitung dari atribut lain, digambar oval putus-putus. Contoh: <span class="mono">umur</span> dari tanggal lahir.</li>
  </ul>`,

  contoh:`<p>Kartu pelajar memuat NIS, nama, tempat/tanggal lahir, dan alamat — semuanya atribut entitas SISWA. Umur tidak perlu disimpan karena dapat dihitung dari tanggal lahir (atribut turunan).</p>`,
  soal:{ q:'Atribut "umur" yang dihitung dari tanggal lahir termasuk jenis atribut…', opsi:['Komposit','Bernilai banyak','Turunan (derived)','Kunci'], benar:2,

{
  id:'e', kode:'E', judul:'Relasi',
  isi:`<p><b>Relasi</b> adalah hubungan antara dua entitas atau lebih. Relasi biasanya diberi nama <b>kata kerja</b> yang menjelaskan hubungannya.</p>
  <p>Cara membaca relasi: <i>[Entitas 1] [kata kerja] [Entitas 2]</i>, misalnya "ANGGOTA <b>meminjam</b> BUKU" atau "GURU <b>mengajar</b> KELAS".</p>
  <p class="def">Relasi hanya dibuat jika memang ada hubungan nyata yang disebutkan dalam kebutuhan sistem.</p>`,

  contoh:`<p>Di aplikasi ojek daring: PENGEMUDI <b>mengantar</b> PENUMPANG. Di marketplace: PEMBELI <b>memesan</b> PRODUK. Nama relasi membuat diagram mudah dibaca oleh orang lain.</p>`,
  soal:{ q:'Nama relasi yang paling tepat antara entitas ANGGOTA dan BUKU pada sistem perpustakaan adalah…', opsi:['judul','meminjam','tanggal','perpustakaan'], benar:1,
    ok:'Tepat! Relasi diberi nama kata kerja: ANGGOTA meminjam BUKU.', hint:'Nama relasi berupa kata kerja.' }
},
{
  id:'f', kode:'F', judul:'Kardinalitas',
  isi:`<p><b>Kardinalitas</b> menyatakan jumlah maksimum data entitas yang dapat berhubungan dengan data entitas lain.</p>
  <ul>
    <li><b>1 : 1 (satu ke satu)</b> — satu data A hanya berhubungan dengan satu data B, dan sebaliknya.</li>
    <li><b>1 : N (satu ke banyak)</b> — satu data A berhubungan dengan banyak data B, tetapi satu data B hanya berhubungan dengan satu data A.</li>
    <li><b>M : N (banyak ke banyak)</b> — satu data A berhubungan dengan banyak data B, dan satu data B juga berhubungan dengan banyak data A.</li>
  </ul>
  <p class="def">Tips: tanyakan dua arah. "Satu kelas punya berapa siswa?" lalu "Satu siswa ada di berapa kelas?"</p>`,
  ilus:`<div class="row" style="justify-content:center;gap:18px">${cardSvg('SEKOLAH','KEPSEK',3,3,[[0,0],[1,1],[2,2]],'1 : 1')}${cardSvg('KELAS','SISWA',2,3,[[0,0],[0,1],[1,2]],'1 : N')}${cardSvg('SISWA','EKSKUL',3,3,[[0,0],[0,1],[1,0],[1,2],[2,2]],'M : N')}</div>`,
  contoh:`<p>Satu sekolah dipimpin satu kepala sekolah (1:1). Satu kelas berisi banyak siswa, tetapi setiap siswa hanya terdaftar di satu kelas (1:N). Seorang siswa boleh mengikuti banyak ekstrakurikuler dan satu ekstrakurikuler diikuti banyak siswa (M:N).</p>`,
  soal:{ q:'"Satu jurusan memiliki banyak kelas, sedangkan satu kelas hanya milik satu jurusan." Kardinalitas JURUSAN – KELAS adalah…', opsi:['1 : 1','1 : N','M : N','N : N tanpa arah'], benar:1,
    ok:'Benar! Satu jurusan → banyak kelas, satu kelas → satu jurusan, jadi 1 : N.', hint:'Periksa dua arah: jurusan ke kelas, lalu kelas ke jurusan.' }
},
{
  id:'g', kode:'G', judul:'Primary Key',
  isi:`<p><b>Primary Key (PK)</b> adalah atribut (atau gabungan atribut) yang nilainya <b>unik</b> untuk setiap baris dan <b>tidak boleh kosong</b> (NOT NULL). PK dipakai untuk mengenali satu data secara pasti.</p>
  <ul>
    <li><b>Unik</b>: tidak ada dua baris dengan nilai PK yang sama.</li>
    <li><b>Tidak kosong</b>: setiap baris wajib memiliki nilai PK.</li>
    <li><b>Stabil</b>: nilainya jarang atau tidak pernah berubah.</li>
  </ul>
  <p>Karena itu <span class="mono">nama</span> tidak cocok menjadi PK: dua siswa bisa bernama sama.</p>`,
  ilus:`<table class="mini-tbl" aria-label="Contoh primary key pada tabel SISWA">
    <thead><tr><th class="key">nis <span class="tag-pk">PK</span></th><th>nama</th><th>id_kelas</th></tr></thead>
    <tbody><tr><td class="key">2425001</td><td class="dup">Rina Saputri</td><td>K01</td></tr>
    <tr><td class="key">2425002</td><td>Budi Santoso</td><td>K01</td></tr>
    <tr><td class="key">2425009</td><td class="dup">Rina Saputri</td><td>K04</td></tr></tbody></table>
    <div class="lbl-chips"><span class="pill warn">nis selalu berbeda → cocok sebagai PK</span><span class="pill err">nama bisa kembar → tidak cocok</span></div>`,
  contoh:`<p>NIK pada KTP, nomor rekening bank, dan NIS siswa adalah contoh primary key di kehidupan nyata: setiap orang/rekening memiliki nomor yang berbeda.</p>`,
  soal:{ q:'Tabel SISWA memiliki kolom nis, nama, alamat, dan tgl_lahir. Kolom yang paling tepat dijadikan Primary Key adalah…', opsi:['nama','alamat','nis','tgl_lahir'], benar:2,
    ok:'Tepat! NIS unik untuk setiap siswa dan tidak boleh kosong.', hint:'Pilih kolom yang pasti berbeda untuk setiap siswa.' }
},
{
  id:'h', kode:'H', judul:'Foreign Key',
  isi:`<p><b>Foreign Key (FK)</b> adalah kolom pada suatu tabel yang <b>merujuk ke Primary Key tabel lain</b>. FK menghubungkan dua tabel.</p>
  <ul>
    <li>FK menjaga <b>integritas referensial</b>: nilai FK harus ada di tabel yang dirujuk (tidak boleh merujuk kelas yang tidak ada).</li>
    <li>Nilai FK <b>boleh berulang</b>, karena banyak siswa bisa berada di kelas yang sama.</li>
    <li>Pada relasi 1:N, FK diletakkan di tabel sisi <b>N</b> (banyak).</li>
  </ul>`,

  </div>`,
  contoh:`<p>Pada nota belanja online tercantum ID pembeli. ID itu merujuk ke data pembeli di tabel akun, sehingga alamat pengiriman tidak perlu disalin ke setiap nota.</p>`,
  soal:{ q:'Pada relasi 1:N antara KELAS dan SISWA, Foreign Key id_kelas diletakkan di tabel…', opsi:['KELAS','SISWA','Tabel baru KELAS_SISWA','Tidak perlu FK'], benar:1,
    ok:'Benar! FK diletakkan di sisi N (SISWA), sehingga setiap siswa menunjuk ke kelasnya.', hint:'Pada relasi 1:N, FK diletakkan di sisi yang "banyak".' }
},
{
  id:'i', kode:'I', judul:'Dari ERD ke Tabel Relasional',
  isi:`<p>Setelah ERD selesai, rancangan diubah (ditransformasi) menjadi tabel. Aturannya:</p>
  <ol>
    <li>Setiap <b>entitas</b> menjadi satu <b>tabel</b>.</li>
    <li>Setiap <b>atribut</b> menjadi <b>kolom</b>; atribut kunci menjadi <b>PK</b>.</li>
    <li>Relasi <b>1 : N</b> → PK tabel sisi 1 ditambahkan sebagai <b>FK</b> di tabel sisi N.</li>
    <li>Relasi <b>1 : 1</b> → PK salah satu tabel ditambahkan sebagai FK di tabel lainnya.</li>
    <li>Relasi <b>M : N</b> → dibuat <b>tabel penghubung baru</b> berisi PK kedua tabel sebagai FK.</li>
  </ol>`,
  ilus:`<div class="stack" style="align-items:center;gap:14px">
    <div class="row" style="justify-content:center"><span class="ent-chip">SISWA</span><span class="pill" style="background:#FDE7EF;color:#8A1E47">mengikuti (M : N)</span><span class="ent-chip">EKSKUL</span></div>
    <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true"><path d="M20 2v24M10 16l10 10 10-10" fill="none" stroke="#1E5EFF" stroke-width="3" stroke-linecap="round"/></svg>

    </div></div>`,
  contoh:`<p>Data pendaftaran ekskul di sekolah biasanya dicatat dalam lembar terpisah berisi NIS dan kode ekskul. Lembar itulah "tabel penghubung" untuk relasi M:N antara SISWA dan EKSKUL. Coba ubah ERD-mu menjadi tabel di menu <b>Praktik</b>.</p>`,
  soal:{ q:'Relasi M:N antara SISWA dan EKSKUL diubah menjadi tabel dengan cara…', opsi:['Menambahkan nis ke tabel EKSKUL','Menambahkan kode_ekskul ke tabel SISWA','Membuat tabel penghubung berisi nis dan kode_ekskul','Menggabungkan SISWA dan EKSKUL menjadi satu tabel'], benar:2,
    ok:'Tepat! Relasi M:N membutuhkan tabel penghubung yang menyimpan PK kedua tabel sebagai FK.', hint:'Pada M:N, satu kolom FK saja tidak cukup untuk menampung "banyak".' }
}
];

   Kunci penilaian: entitas wajib (beserta sinonim nama),
   atribut wajib, PK, dan relasi + kardinalitas.
   Relasi 1:N ditulis {a: sisi 1, b: sisi N}. */
const CASES = [
{
  id:'akademik', judul:'Sistem Informasi Akademik',
  cerita:'Sekolah ingin mencatat data siswa, kelas, dan jurusan. Setiap siswa memiliki NIS, nama, tanggal lahir, dan alamat. Setiap kelas memiliki kode kelas dan nama kelas. Setiap jurusan memiliki kode jurusan dan nama jurusan. Satu kelas berisi banyak siswa, tetapi setiap siswa hanya terdaftar di satu kelas. Satu jurusan memiliki banyak kelas, dan setiap kelas hanya berada di satu jurusan.',
  entities:[
    {key:'SISWA', syn:['siswa','murid','pelajar','pesertadidik'], hint:'orang yang belajar di sekolah', attrs:[

  const d = (Date.now() - t) / 1000;
  if (d < 60) return 'baru saja';
  if (d < 3600) return Math.floor(d / 60) + ' menit lalu';

}

/* ---------- 2.2 Penyimpanan progres (LocalStorage) ----------

const STORE_KEY = 'dbmasterlab_progres_v1';
const ERD_PASS = 80;               // skor minimal evaluasi ERD dianggap lulus
let storageOK = true;
function defaultState(){
  return { nama:'', kelas:'', materi:{}, erd:{ designs:{}, best:{}, current:'akademik', notation:'chen' }, notifSeen:0,
    audio:{ sfx:true, music:false, sfxVol:70, musicVol:45, rate:1 },

    quiz:{ best:null, last:null, attempts:0, history:[] }, badges:[], activity:[] };

function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const d = JSON.parse(raw), b = defaultState();
    return Object.assign(b, d, {
      erd: Object.assign(b.erd, d.erd || {}), tabel: Object.assign(b.tabel, d.tabel || {}),
      game: Object.assign(b.game, d.game || {}), quiz: Object.assign(b.quiz, d.quiz || {}), audio: Object.assign(b.audio, d.audio || {}),
      materi: d.materi || {}, badges: d.badges || [], activity: d.activity || [] });
  } catch (e) { storageOK = false; return defaultState(); }
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}
let S = loadState();
function logActivity(text, icon = 'check'){
  S.activity.unshift({ t: Date.now(), text, icon });

/* ---------- 2.3 Perhitungan progres & lencana ---------- */
const doneMateri = () => MATERI.filter(m => S.materi[m.id]).length;
const erdPassed  = () => CASES.filter(c => (S.erd.best[c.id] || 0) >= ERD_PASS).length;
const gamePassed = () => [1,2,3].filter(l => S.game[l] && S.game[l].passed).length;
const quizPassed = () => (S.quiz.best || 0) >= KKM;
function overall(){
  // 9 materi + 4 studi kasus ERD + 1 simulasi kunci + 3 level gim + 1 kuis = 18 unit
  const total = MATERI.length + CASES.length + 1 + 3 + 1;
  const done = doneMateri() + erdPassed() + (S.tabel.keys ? 1 : 0) + gamePassed() + (quizPassed() ? 1 : 0);
  const pct = Math.round(done / total * 100);
  const RANKS = ['Database Beginner', 'ERD Designer', 'Database Architect', 'Database Developer'];
  const li = pct >= 100 ? 3 : pct >= 67 ? 2 : pct >= 34 ? 1 : 0;
  return { pct, done, total, rank:RANKS[li], level:li + 1 };
}
const BADGES = [
  { id:'pemula',  nama:'Pemula Basis Data', desc:'Menyelesaikan 1 materi', ok:() => doneMateri() >= 1 },
  { id:'konsep',  nama:'Ahli Konsep', desc:'Menyelesaikan semua materi A–I', ok:() => doneMateri() >= MATERI.length },

  { id:'kasus',   nama:'Penakluk Studi Kasus', desc:`Skor ERD ≥ ${ERD_PASS} pada keempat studi kasus`, ok:() => erdPassed() >= CASES.length },

  { id:'lv2',     nama:'ERD Designer', desc:'Lulus gim Level 2', ok:() => !!(S.game[2] && S.game[2].passed) },
  { id:'lv3',     nama:'Database Architect', desc:'Lulus gim Level 3', ok:() => !!(S.game[3] && S.game[3].passed) },

  const now = BADGES.filter(b => b.ok()).map(b => b.id);

/* ---------- 2.4b Audio: efek suara, musik latar, narasi ----------
   Semua bunyi dibuat langsung oleh peramban (Web Audio API), tanpa berkas
   audio dan tanpa internet. Musik hanya berbunyi setelah murid mengaktifkannya. */
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
/* Tema musik: lab (tenang), game (bersemangat), focus (untuk kuis) */
const MUSIC_THEMES = {
  lab:   { bpm:84,  wave:'triangle', chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], arp:[0,1,2,1,2,1,0,1], every:2, hat:false, pad:.05,  lead:.035, bass:.06 },
  game:  { bpm:118, wave:'square',   chords:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]], arp:[0,2,1,2,0,2,1,2], every:2, hat:true,  pad:.03,  lead:.02,  bass:.07 },
  focus: { bpm:70,  wave:'sine',     chords:[[50,53,57],[46,50,53],[48,52,55],[45,48,52]], arp:[0,1,2,1],         every:4, hat:false, pad:.045, lead:.03,  bass:.045 }
};
const AUDIO = {
  ctx:null, sfxBus:null, musicBus:null, noise:null, timer:null, step:0, next:0, theme:'lab', ducked:false, count:0, lastAt:0,
  /* Membuat AudioContext saat pertama dibutuhkan (harus setelah interaksi murid) */
  ensure(){
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        const c = this.ctx = new AC();
        this.sfxBus = c.createGain(); this.sfxBus.connect(c.destination);
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(c.destination);
        this.musicBus = c.createGain(); this.musicBus.gain.value = 0; this.musicBus.connect(lp);
        const len = Math.floor(c.sampleRate * .2), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
        this.applyVolume();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  applyVolume(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfxBus.gain.setTargetAtTime(S.audio.sfxVol / 100 * .9, t, .02);
    this.musicBus.gain.setTargetAtTime(this.timer ? S.audio.musicVol / 100 * (this.ducked ? .25 : 1) : 0, t, .3);
  },
  /* Satu nada dengan selubung (envelope) sederhana */
  tone(f, t, dur, o = {}){
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain(), v = o.vol ?? .2, a = o.attack ?? .008;
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(o.bus || this.sfxBus); osc.start(t); osc.stop(t + dur + .05);
  },
  hat(t, vol){
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
    s.connect(f); f.connect(g); g.connect(this.musicBus); s.start(t); s.stop(t + .06);
  },
  /* Efek suara bertema lab digital */
  sfx(name){
    if (!S.audio.sfx) return;
    const now = performance.now();
    if ((name === 'success' || name === 'error') && now - this.lastAt < 200) return;   // jangan menumpuk dengan bunyi utama
    const c = this.ensure(); if (!c) return;
    this.count++; this.lastAt = now;
    const t = c.currentTime + .01, T = (f, d, dt, o) => this.tone(f, t + dt, d, o);
    switch (name) {
      case 'click':   T(1320, .05, 0, { type:'triangle', vol:.06 }); break;
      case 'nav':     T(660, .07, 0, { type:'triangle', vol:.07 }); T(990, .09, .05, { type:'triangle', vol:.06 }); break;
      case 'place':   T(520, .1, 0, { vol:.15, slide:780 }); break;
      case 'delete':  T(440, .16, 0, { type:'triangle', vol:.13, slide:180 }); break;
      case 'correct': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => T(f, .22, i * .07, { type:'triangle', vol:.16 })); break;
      case 'wrong':   T(233, .22, 0, { type:'sawtooth', vol:.06, slide:150 }); T(175, .3, .1, { type:'square', vol:.045 }); break;
      case 'error':   T(300, .12, 0, { type:'square', vol:.045 }); break;
      case 'success': T(784, .12, 0, { vol:.11 }); T(1175, .2, .08, { vol:.09 }); break;
      case 'hint':    T(1568, .5, 0, { vol:.09 }); T(2093, .6, .12, { vol:.06 }); break;
      case 'badge':   [392, 523.25, 659.25, 783.99].forEach((f, i) => T(f, .18, i * .09, { type:'square', vol:.055 }));
                      [523.25, 659.25, 1046.5].forEach(f => T(f, .9, .4, { type:'triangle', vol:.07, attack:.03 })); break;
      case 'levelup': [523.25, 587.33, 659.25, 783.99, 880, 1046.5].forEach((f, i) => T(f, .16, i * .08, { type:'square', vol:.055 }));
                      T(1046.5, .8, .5, { type:'triangle', vol:.11 }); T(1318.5, .8, .5, { type:'triangle', vol:.07 }); break;
      case 'fail':    [392, 349.23, 311.13, 261.63].forEach((f, i) => T(f, .28, i * .14, { type:'triangle', vol:.11 })); break;
    }
  },
  /* Musik latar prosedural: akor pad + bass + arpeggio (+ hi-hat pada tema gim) */
  playStep(st, t, th, spb){
    const ch = th.chords[Math.floor(st / 16) % th.chords.length], s16 = st % 16, b = { bus:this.musicBus };
    if (s16 === 0) ch.forEach(n => this.tone(midi(n), t, spb * 16, { ...b, vol:th.pad, attack:.4 }));
    if (s16 % 8 === 0) this.tone(midi(ch[0] - 12), t, spb * 7, { ...b, type:'triangle', vol:th.bass, attack:.02 });
    if (s16 % th.every === 0) this.tone(midi(ch[th.arp[(s16 / th.every) % th.arp.length]] + 12), t, spb * th.every * .9, { ...b, type:th.wave, vol:th.lead });
    if (th.hat && s16 % 4 === 2) this.hat(t, .05);
  },
  schedule(){
    const c = this.ctx, th = MUSIC_THEMES[this.theme], spb = 60 / th.bpm / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + .05;
    while (this.next < c.currentTime + .3) { this.playStep(this.step, this.next, th, spb); this.next += spb; this.step = (this.step + 1) % 256; }
  },
  startMusic(){ const c = this.ensure(); if (!c || this.timer) return; this.step = 0; this.next = c.currentTime + .1; this.timer = setInterval(() => this.schedule(), 80); this.applyVolume(); },
  stopMusic(){ if (!this.timer) return; clearInterval(this.timer); this.timer = null; this.applyVolume(); },
  setTheme(name){ if (MUSIC_THEMES[name] && name !== this.theme) { this.theme = name; this.step = 0; } },
  duck(on){ this.ducked = on; this.applyVolume(); }
};
/* Narasi materi & soal memakai suara bawaan perangkat (Text-to-Speech) */
const NARR = {
  ok:'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window, speaking:false,
  speak(text){
    if (!this.ok) { toast('Narasi suara tidak didukung peramban ini.', 'error'); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'id-ID'; u.rate = S.audio.rate || 1;
      const v = speechSynthesis.getVoices().find(x => /^id/i.test(x.lang)); if (v) u.voice = v;
      u.onend = u.onerror = () => { this.speaking = false; AUDIO.duck(false); updateNarrBtns(); };
      this.speaking = true; AUDIO.duck(true); speechSynthesis.speak(u); updateNarrBtns();
    } catch (e) { this.speaking = false; toast('Narasi suara gagal diputar.', 'error'); }
  },
  stop(){ try { if (this.ok) speechSynthesis.cancel(); } catch (e) {} this.speaking = false; AUDIO.duck(false); updateNarrBtns(); }
};
const narrBtnHtml = act => NARR.ok ? `<button class="btn btn-outline btn-sm narr-btn" data-act="${act}" aria-pressed="${NARR.speaking}">${NARR.speaking ? ic('stop',16) + ' Hentikan' : ic('vol',16) + ' Dengarkan'}</button>` : '';
function updateNarrBtns(){ $$('.narr-btn').forEach(b => { b.setAttribute('aria-pressed', NARR.speaking); b.innerHTML = NARR.speaking ? ic('stop',16) + ' Hentikan' : ic('vol',16) + ' Dengarkan'; }); }
const plainText = html => { const d = document.createElement('div'); d.innerHTML = html; d.querySelectorAll('svg').forEach(s => s.remove()); d.querySelectorAll('li').forEach(li => li.append('. ')); return d.textContent.replace(/\s+/g, ' ').trim(); };
function updateAudioBtns(){

  m.innerHTML = ic(S.audio.music ? 'music' : 'musicOff', 20); m.classList.toggle('on', S.audio.music); m.setAttribute('aria-pressed', S.audio.music);

}
document.addEventListener('visibilitychange', () => {

  beranda:  { title:'Beranda', page:() => pageBeranda() },
  materi:   { title:() => `Materi ${MATERI[materiIdx].kode}: ${MATERI[materiIdx].judul}`, page:() => pageMateri() },
  praktik:  { title:'Praktik: Laboratorium Basis Data', page:() => pagePraktik(), after:() => afterPraktik() },

  progres:  { title:'Progres Belajar', page:() => pageProgres() },
  profil:   { title:'Profil', page:() => pageProfil() }
};
function render(route, keepAnim){
  if (!ROUTES[route]) route = 'beranda';
  if (NARR.speaking) NARR.stop();
  currentRoute = route;
  AUDIO.setTheme(route === 'tantangan' ? 'game' : route === 'kuis' ? 'focus' : 'lab');
  const R = ROUTES[route], view = $('#view');
  $('#page-title').textContent = typeof R.title === 'function' ? R.title() : R.title;
  view.innerHTML = R.page();
  if (!keepAnim) { view.style.animation = 'none'; void view.offsetHeight; view.style.animation = ''; }
  if (R.after) R.after();
  animateBars(view);
  updateChrome();
}
let navStack = [];   // riwayat halaman untuk tombol Kembali
function navigate(route, noPush){

  closeDrawer();
  if (route !== currentRoute) AUDIO.sfx('nav');
  render(route);
  try { if (location.hash !== '#' + currentRoute) location.hash = currentRoute; } catch (e) {}
  window.scrollTo(0, 0);
  try { $('#view').focus({ preventScroll:true }); } catch (e) {}
}

window.addEventListener('hashchange', () => {

  if (r && ROUTES[r] && r !== currentRoute) { render(r); window.scrollTo(0, 0); }
});

function nextStep(){
  if (doneMateri() < MATERI.length) return { to:'materi', label:'Lanjutkan Materi' };
  if (erdPassed() < 1) return { to:'praktik', label:'Coba Simulasi ERD' };
  if (gamePassed() < 3) return { to:'tantangan', label:'Lanjutkan Tantangan' };
  if (!quizPassed()) return { to:'kuis', label:'Kerjakan Kuis' };
  return { to:'progres', label:'Lihat Progres' };
}
function pageBeranda(){
  const o = overall(), nx = nextStep(), c = caseById(S.erd.current || 'akademik'), best = S.erd.best[c.id];
  const menus = [
    ['materi','Materi','Pelajari konsep dasar basis data, ERD, dan kunci.','book','#0E8C7E', `${doneMateri()}/${MATERI.length} topik selesai`],

    ['tantangan','Tantangan','Selesaikan misi dan raih lencana!','game','#D9366F', `${gamePassed()}/3 level lulus`],
    ['kuis','Kuis','Uji pemahamanmu dengan kuis interaktif.','quiz','#1E5EFF', S.quiz.best == null ? 'Belum dikerjakan' : `Skor terbaik ${S.quiz.best}`]
  ];
  return `
  <section class="hero">
    <div>
      <span class="eyebrow">Media Pembelajaran Basis Data · Kelas XI RPL/PPLG</span>
      <h1>DB MASTER LAB</h1>

/* ---------- 3A. ERD BUILDER ----------
   Model rancangan: { caseId, entities:[{id,name,x,y,attrs:[{id,name,pk}]}],
                      rels:[{id,a,b,name,card}] }
   card: '1:1' | '1:N' (a sisi 1, b sisi N) | 'N:1' | 'M:N' | '' */
const ENT_W = 184, HEAD_H = 34, ROW_H = 24, CW = 900, CH = 640;   // notasi kotak + ukuran kanvas
const CH_W = 150, CH_H = 46, OV_GAP = 36;                            // notasi Chen: kotak entitas & jarak oval
const ENT_COLORS = [['#D6F1FB','#0891B2'], ['#DDF7E6','#16A34A'], ['#E3EAFF','#1E5EFF'], ['#FFF1D6','#D97706']];
let erd = null, erdSel = null, erdEval = null, drag = null, persistTimer = null;
const caseById = id => CASES.find(c => c.id === id) || CASES[0];
const entH = e => HEAD_H + Math.max(1, e.attrs.length) * ROW_H + 10;
const getEnt = (id, d = erd) => d.entities.find(e => e.id === id);
const getRel = (id, d = erd) => d.rels.find(r => r.id === id);
const isChen = () => S.erd.notation !== 'kotak';
const ovRx = n => Math.max(38, Math.min(92, String(n || '').length * 4.3 + 18));
/* Ukuran entitas: rw/rh = kotak entitas (titik sambung relasi), w/h = seluruh grup termasuk oval atribut */
function dims(e){
  if (!isChen()) { const h = entH(e); return { rw:ENT_W, rh:h, w:ENT_W, h }; }
  const n = e.attrs.length, mrx = n ? Math.max(...e.attrs.map(a => ovRx(a.name.trim() || '(kosong)'))) : 0;
  return { rw:CH_W, rh:CH_H, w:Math.max(CH_W, 56 + 2 * mrx), h:CH_H + (n ? 12 + n * OV_GAP : 0) };
}

function erdFromStarter(c){
  return { caseId:c.id, rels:[], entities:c.starter.map(s => ({ id:uid(), name:s.name, x:s.x, y:s.y,
    attrs:s.attrs.map(([n, pk]) => ({ id:uid(), name:n, pk })) })) };
}
function erdOpen(caseId){

  erd.caseId = c.id; S.erd.current = c.id;

  erdSel = null; erdEval = null;
}
function erdPersist(){ if (!erd) return; S.erd.designs[erd.caseId] = JSON.parse(JSON.stringify(erd)); save(); }

}

/* Titik pada tepi kotak entitas menuju titik t (agar garis berhenti di tepi) */
function edgePt(E, t){
  const D = dims(E), cx = E.x + D.rw / 2, cy = E.y + D.rh / 2, hw = D.rw / 2 + 3, hh = D.rh / 2 + 3;
  const dx = t.x - cx, dy = t.y - cy;
  if (!dx && !dy) return { x:cx, y:cy };
  const k = 1 / Math.max(Math.abs(dx) / hw, Math.abs(dy) / hh);
  return { x:cx + dx * k, y:cy + dy * k };
}
const cardLabels = c => ({'1:1':['1','1'],'1:N':['1','N'],'N:1':['N','1'],'M:N':['M','N']}[c] || ['?','?']);
/* Membuat isi SVG diagram ERD. interactive=false untuk tampilan hasil */
function erdMarkup(d, interactive, pid){
  let s = `<defs><pattern id="${pid}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#E6ECF7" stroke-width="1"/></pattern></defs>`;
  if (interactive) s += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="url(#${pid})"/>`;
  // garis relasi (digambar lebih dulu agar berada di bawah entitas)
  d.rels.forEach(r => {
    const A = getEnt(r.a, d), B = getEnt(r.b, d); if (!A || !B) return;
    const DA = dims(A), DB = dims(B);
    const ca = { x:A.x + DA.rw / 2, y:A.y + DA.rh / 2 }, cb = { x:B.x + DB.rw / 2, y:B.y + DB.rh / 2 };
    const pa = edgePt(A, cb), pb = edgePt(B, ca);
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const len = Math.hypot(pb.x - pa.x, pb.y - pa.y) || 1, ux = (pb.x - pa.x) / len, uy = (pb.y - pa.y) / len;
    const [la, lb] = cardLabels(r.card);
    const sel = interactive && erdSel && erdSel.type === 'rel' && erdSel.id === r.id;
    const lab = (p, dir, t) => { const x = p.x + ux * 18 * dir - uy * 13, y = p.y + uy * 18 * dir + ux * 13 + 5;
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="16" font-weight="800" fill="${t === '?' ? '#C62828' : '#0B1F4B'}" font-family="Poppins,sans-serif">${t}</text>`; };
    s += `<g class="rel" data-rel="${r.id}" ${interactive ? `tabindex="0" role="button" aria-label="Relasi ${esc(r.name || 'tanpa nama')} antara ${esc(A.name)} dan ${esc(B.name)}"` : ''}>
      <line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="transparent" stroke-width="16"/>
      <line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${sel ? '#1E5EFF' : '#4F5D78'}" stroke-width="${sel ? 3 : 2.2}"/>
      <polygon points="${mx-58},${my} ${mx},${my-25} ${mx+58},${my} ${mx},${my+25}" fill="${sel ? '#FFCFE0' : '#FDE7EF'}" stroke="#D9366F" stroke-width="${sel ? 3 : 2}"/>
      <text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="${r.name.trim() ? '#8A1E47' : '#C62828'}" font-family="Plus Jakarta Sans,sans-serif">${esc(trunc(r.name.trim() || '(nama?)', 14))}</text>
      ${lab(pa, 1, la)}${lab(pb, -1, lb)}</g>`;
  });
  // entitas
  d.entities.forEach((e, idx) => {
    const sel = interactive && erdSel && erdSel.type === 'ent' && erdSel.id === e.id, noName = !e.name.trim(), D = dims(e);
    const aria = interactive ? `tabindex="0" role="button" aria-label="Entitas ${esc(e.name || 'tanpa nama')}, ${e.attrs.length} atribut"` : '';
    if (isChen()) {
      // Notasi Chen: kotak entitas + oval atribut tersusun di bawahnya
      const [fill, stroke] = ENT_COLORS[idx % ENT_COLORS.length], n = e.attrs.length, cyOf = i => CH_H + 26 + i * OV_GAP;
      s += `<g class="ent" data-ent="${e.id}" transform="translate(${e.x},${e.y})" ${aria}>
        <rect x="-6" y="-6" width="${D.w + 12}" height="${D.h + 12}" rx="10" fill="${sel ? 'rgba(30,94,255,.06)' : 'transparent'}" ${sel ? 'stroke="#1E5EFF" stroke-dasharray="5 4"' : ''}/>
        ${n ? `<line x1="28" y1="${CH_H}" x2="28" y2="${cyOf(n - 1)}" stroke="#7A86A0" stroke-width="1.5"/>` : ''}`;
      e.attrs.forEach((a, i) => {
        const nm = a.name.trim() || '(kosong)', rx = ovRx(nm), cy = cyOf(i);
        s += `<line x1="28" y1="${cy}" x2="56" y2="${cy}" stroke="#7A86A0" stroke-width="1.5"/>
          <ellipse cx="${56 + rx}" cy="${cy}" rx="${rx}" ry="15" fill="${a.pk ? '#FFF5D6' : '#fff'}" stroke="${a.pk ? '#D9A200' : '#7FB8E6'}" stroke-width="1.6"/>

}
